function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const rr = (a, b) => a + (b - a) * rng();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

};

const SAVE_KEY = 'surinuke_meta';

function defaultMeta() { return { coins: 0, stage: 1, lvStart: 0, lvPower: 0, lvRate: 0, lvFire: 0, shield: false, rocket: false }; }
let meta = defaultMeta();
function loadMeta() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) meta = Object.assign(defaultMeta(), JSON.parse(s));
    localStorage.setItem(SAVE_KEY + '_t', '1');
    saveOK = localStorage.getItem(SAVE_KEY + '_t') === '1';   
  } catch (e) { saveOK = false; }
}
const RESET_BTN = { x: 250, y: 596, w: 102, h: 22 };

  meta = defaultMeta();
  try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_KEY + '_t'); } catch (e) { saveOK = false; }
  saveMeta();
}
function saveMeta() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) { saveOK = false; }
}
const SHOP = [
  { id: 'start',  label: 'ARMY +5',      cost: m => Math.round(20 * Math.pow(1.5, m.lvStart)), lv: m => m.lvStart,  buy: m => m.lvStart++ },
  { id: 'power',  label: 'POWER +15%',   cost: m => Math.round(25 * Math.pow(1.5, m.lvPower)), lv: m => m.lvPower,  buy: m => m.lvPower++ },
  { id: 'rate',   label: 'FIRE RATE +20%', cost: m => Math.round(25 * Math.pow(1.5, m.lvRate)), lv: m => m.lvRate,  buy: m => m.lvRate++ },   
  
];
function unlockedProps(m) {
  const p = ['FIRE', 'SPLIT'];
  if (m.shield) p.push('SHIELD');
  if (m.rocket) p.push('ROCKET');
  return p;
}


function newRun(stage, m, seed) {
  rng = mulberry32(seed == null ? (Date.now() & 0xffffffff) : seed);
  const mul = Math.pow(CONFIG.STAGE_GROW, stage - 1);
  const len = Math.min(52 + stage * 3, 80);          
  const g = {
    stage, mul, len, t: 0, over: null,
    N: CONFIG.START_UNITS + 5 * m.lvStart,
    power: 1 + 0.15 * m.lvPower,
    rateMul: 1 + CONFIG.RATE_UP * (m.lvRate || 0),   
    props: { FIRE: 0, SPLIT: 0, SHIELD: 0, ROCKET: 0 },
    guards: [],                                      
    groups: [], rowsSpawned: 0,                      
    typ: { FIRE: 0, SPLIT: 0, ROCKET: 0 },          
    phase: 'run', segT: 0, segIdx: 0, segs: CONFIG.SEGS + Math.min(2, Math.floor((stage - 1) / 2)), finalRest: false,
    lanes: [1, 1, 1, 1, 1], laneT: 0, streamAcc: 0,
    dist: 0, ti: 0, rows: [], track: null, trackEnd: 1,
    encT: 0.5, encDone: 0, encs: CONFIG.ENCS + Math.floor((stage - 1) / 2), tireT: 3, miniT: 4,
    slam: null, dodges: 0,                           
    combos: [],
    unlocked: unlockedProps(m),
    lx: (CONFIG.ROAD_L + CONFIG.ROAD_R) / 2, target: (CONFIG.ROAD_L + CONFIG.ROAD_R) / 2,
    units: [],                                       
    bullets: [], ebullets: [], enemies: [], gates: [], obst: [],
    boss: null, bossSpawned: false,
    nextGate: 0.5, nextWave: 5.0, nextObst: 9.0,   
    fireAcc: {}, flips: 0, cR: 10, cDepth: 10,
    coins: 0, slips: 0, kills: 0, gatesPassed: 0,
    stats: { lostContact: 0, lostObst: 0, lostShot: 0, lostSaw: 0, lostWall: 0, lostBarr: 0 },
  };
  return g;
}


const SIZE = { 1: 8, 10: 13, 100: 20 };
function normalN(g) { return Math.max(0, g.N - g.typ.FIRE - g.typ.SPLIT - g.typ.ROCKET); }
function crowdItems(g) {
  const items = [];
  const pushType = (type, cnt, cap) => {
    cnt = Math.round(cnt); if (cnt <= 0) return;
    const w = cnt > cap ? Math.ceil(cnt / cap) : 1;
    for (let left = cnt; left > 0; left -= w) items.push({ type, w: Math.min(w, left), d: 8 });
  };
  pushType('FIRE', g.typ.FIRE, 40);
  pushType('SPLIT', g.typ.SPLIT, 40);
  pushType('ROCKET', g.typ.ROCKET, 40);
  let n = Math.round(normalN(g));
  const tiers = n >= 300 ? [100, 10, 1] : n >= 120 ? [10, 1] : [1];      
  for (const t of tiers) {
    const c = t === 1 ? n : Math.floor(n / t);
    for (let k = 0; k < c && items.length < 240; k++) items.push({ type: '', w: t, d: SIZE[t] });
    n -= c * t;
  }
  return items;
}
function layoutCrowd(g, dt) {
  const C = CONFIG, items = crowdItems(g);
  
  const rowW = formW(g);
  
  const rows = []; let row = [], x = 0, y = C.LEADER_Y, h = 0;
  for (const it of items) {
    if (x + it.d > rowW && row.length) { rows.push({ row, w: x, y, h }); y += h; row = []; x = 0; h = 0; }
    it.ox = x + it.d / 2; x += it.d; h = Math.max(h, it.d); row.push(it);
  }
  if (row.length) rows.push({ row, w: x, y, h });
  const old = g.units, k = Math.min(1, dt * 20);   
  let i = 0;
  for (const r of rows) for (const it of r.row) {
    const o = old[i++];
    const tx = clamp(g.lx - r.w / 2 + it.ox, C.ROAD_L + 3, C.ROAD_R - 3), ty = r.y + r.h / 2;
    it.x = o ? o.x : g.lx; it.y = o ? o.y : C.LEADER_Y + 20;
    it.x += (tx - it.x) * k; it.y += (ty - it.y) * k;
  }
  g.units = items;
  g.cR = rowW / 2; g.cDepth = rows.length ? y + h - C.LEADER_Y : 8;
}
function crowdR(g) { return g.cR; }
function formW(g) { return clamp(20 + 12 * Math.sqrt(Math.max(1, g.N)), 20, 142); }


function setN(g, n, plain) {
  n = Math.max(0, Math.round(n));
  if (!plain && g.N > 0) for (const k in g.typ) g.typ[k] *= n / g.N;
  g.N = n;
  const sum = g.typ.FIRE + g.typ.SPLIT + g.typ.ROCKET;
  if (sum > n) for (const k in g.typ) g.typ[k] *= n / sum;
}

function removeSoldiers(g, n, first) {
  const order = first === '' ? ['', 'FIRE', 'SPLIT', 'ROCKET'] : first ? [first, 'FIRE', 'SPLIT', 'ROCKET', ''] : ['FIRE', 'SPLIT', 'ROCKET', ''];
  for (const t of order) {
    if (n <= 0) break;
    const have = t ? g.typ[t] : normalN(g), d = Math.min(n, have);
    if (t) g.typ[t] -= d;
    g.N -= d; n -= d;
  }
  g.N = Math.max(0, Math.round(g.N));
  for (const k in g.typ) g.typ[k] = clamp(Math.round(g.typ[k]), 0, g.N);
}
function loseUnits(g, n, why, x, y, first) {
  n = Math.max(0, Math.round(n));
  if (n <= 0) return;
  removeSoldiers(g, n, first);
  g.stats[why] += n;
  if (!SIM) { popText(x, y, '-' + n, '#ff5a6a'); sfx('lose'); shake(3); }
  if (g.N <= 0) { g.over = 'fail'; if (!SIM) sfx('fail'); }
}



function makeGateSide(g, kind) {
  const s = g.stage, sc = 1 + 0.3 * (s - 1);
  if (kind === 'hire') {   
    const p = g.unlocked[ri(0, g.unlocked.length - 1)];
    const k = (p === 'SHIELD' ? ri(2, 3) : p === 'FIRE' ? ri(1, 3) : p === 'ROCKET' ? ri(1, 2) : ri(2, 4)) + (p === 'SHIELD' ? 0 : Math.floor((s - 1) / 3));
    return { type: 'hire', prop: p, v: k, max: k + 2, good: true, hitT: 0 };
  }
  if (kind === 'bad') {
    if (rng() < 0.2) return { type: 'div', v: 2, charge: 0, need: CONFIG.DIV_NEED, good: false, hitT: 0 };
    const k = Math.round(rr(15, 30) * sc);   
    return { type: 'add', v: -k, max: k * 2 + 10, good: false, hitT: 0 };
  }
  const r = rng();
  
  if (r < 0.02) return { type: 'mul', v: 3, good: true, hitT: 0 };
  if (r < 0.07) return { type: 'mul', v: 2, good: true, hitT: 0 };
  const k = Math.round(rr(4, 10) * sc);
  return { type: 'add', v: k, max: k * 2 + 10, good: true, hitT: 0 };
}
function gateLabel(sd) {
  if (sd.type === 'add') { const v = Math.round(sd.v); return v >= 0 ? '+' + v : '−' + (-v); }
  if (sd.type === 'mul') return '×' + sd.v;
  if (sd.type === 'div') return '÷' + sd.v;
  return '+' + Math.round(sd.v) + ' ' + PROPS[sd.prop].name;
}

function shootGate(g, sd, b, x, y) {
  sd.hitT = 0.08;
  
  
  const add = CONFIG.GATE_HIT * Math.sqrt(10 / Math.max(10, g.N)) * (b.flame ? 0.25 : b.rocket ? 2 : b.pellet ? 0.5 : 1);
  if (sd.type === 'add') {
    const before = sd.v;
    sd.v = Math.min(sd.max, sd.v + add);
    if (before < 0 && sd.v >= 0) flip(g, sd, x, y);
  } else if (sd.type === 'hire') {
    sd.v = Math.min(sd.max, sd.v + add * CONFIG.HIRE_HIT);
  } else if (sd.type === 'div' && !sd.good) {   
    sd.charge += add;
    if (sd.charge >= sd.need) {
      if (sd.type === 'div') { sd.type = 'mul'; sd.v = 2; }
      flip(g, sd, x, y);
    }
  }
}
function flip(g, sd, x, y) {
  sd.good = true; g.flips++;
  if (!SIM) { burst(x, y, '#3fa9ff', 18); popText(x, y - 28, 'FLIP!', '#fff', 18); sfx('flip'); }
}
function spawnGateRow(g) {
  const r = rng();
  let a, b;
  
  if (g.rowsSpawned++ < 2) { a = 'num'; b = rng() < 0.5 ? 'hire' : 'num'; }   
  else if (r < 0.35) { a = 'num'; b = 'bad'; }
  else if (r < 0.60) { a = 'hire'; b = 'bad'; }
  else if (r < 0.80) { a = 'bad'; b = 'bad'; }    
  else if (r < 0.92) { a = 'num'; b = 'hire'; }
  else               { a = 'num'; b = 'num'; }
  let L = makeGateSide(g, a), R = makeGateSide(g, b);
  if (rng() < 0.5) [L, R] = [R, L];
  
  const both = rng() < CONFIG.BOTH_RATE;
  
  const sway = g.stage >= 3 && rng() < 0.35 + 0.05 * g.stage ? rr(40, 70) : 0;
  const gt = { y: -30, gx: rr(110, 250), sway: both ? sway : 0, ph: rr(0, 6.28), L, R, both, done: false };
  g.gates.push(gt);
  
  if (false && g.t > 8 && !both && !g.boss && rng() < CONFIG.BLOCK_RATE) {      
    const worth = sd => sd.type === 'hire' ? 3 : sd.type === 'mul' ? 3 : sd.good ? 2 : sd.type === 'div' ? 1 : 0;
    const gx = gt.gx, left = worth(L) >= worth(R);
    const x0 = left ? CONFIG.ROAD_L : gx, x1 = left ? gx : CONFIG.ROAD_R;
    const hp = Math.round((60 + CONFIG.BARR_HP * g.stage) * enemyMul(g));
    g.obst.push({ kind: 'barr', y: -30, x0: x0 + 4, x1: x1 - 4, hp, max: hp, hitT: 0, hit: new Set() });
    gt.y = -110;
  }
}

function spawnBossGate(g) {
  const r = rng(), kind = r < 0.45 ? 'num' : r < 0.8 ? 'bad' : 'hire';
  const sd = makeGateSide(g, kind), none = { type: 'none', good: false, hitT: 0 };
  const left = rng() < 0.5;
  g.gates.push({ y: -30, gx: left ? rr(130, 170) : rr(190, 230), sway: 0, ph: 0, L: left ? sd : none, R: left ? none : sd, both: false, done: false });
}
function gapX(gt, t) { return clamp(gt.gx + Math.sin(t * 1.6 + gt.ph) * gt.sway, 70, 290); }

function applyGate(g, side) {
  if (side.type === 'none') return;
  const n0 = g.N;
  if (side.type === 'add') { const v = Math.round(side.v); v >= 0 ? setN(g, g.N + v, true) : setN(g, g.N + v); }
  else if (side.type === 'mul') setN(g, g.N * side.v);
  else if (side.type === 'div') setN(g, Math.floor(g.N / side.v));
  else if (side.type === 'hire') {
    const add = Math.round(side.v);
    g.props[side.prop]++;
    if (side.prop === 'SHIELD')
      for (let k = 0; k < add; k++) g.guards.push({ x: g.lx, y: CONFIG.LEADER_Y - 20, hp: CONFIG.GUARD_HP });
    else { g.N += add; g.typ[side.prop] += add; }
    if (!SIM) pickupFx(side.prop, g.props[side.prop]);
    for (const c of COMBOS) {
      if (!g.combos.includes(c.name) && g.props[c.a] > 0 && g.props[c.b] > 0) {
        g.combos.push(c.name);
        if (!SIM) banner(c);
      }
    }
  }
  if (g.N < n0) g.stats.lostGate = (g.stats.lostGate || 0) + (n0 - g.N);   
  if (g.N <= 0) { g.over = 'fail'; if (!SIM) sfx('fail'); }
}



function wallAt(o, x, pad) { return o.segs.some(sg => sg.hp > 0 && x > sg.x0 - pad && x < sg.x1 + pad); }

function wallOpen(o, x) {
  let a = CONFIG.ROAD_L, b = CONFIG.ROAD_R;
  for (const sg of o.segs) if (sg.hp > 0) { if (sg.x1 <= x) a = Math.max(a, sg.x1); else if (sg.x0 >= x) b = Math.min(b, sg.x0); else return 0; }
  return b - a;
}
function spawnObstacle(g) {
  if (rng() < 0.5) {
    g.obst.push({ kind: 'saw', y: -30, x: rr(60, 300), r: 16, vx: rr(-70, 70) * (g.stage >= 2 ? 1 : 0.4), hit: new Set() });
  } else {
    const hw = clamp(110 - g.stage * 6, 60, 110);      
    const hx = rr(40 + hw / 2, 320 - hw / 2), hp = Math.round((30 + CONFIG.WALL_HP * g.stage) * enemyMul(g));
    const segs = [{ x0: CONFIG.ROAD_L, x1: hx - hw / 2 }, { x0: hx + hw / 2, x1: CONFIG.ROAD_R }]
      .filter(sg => sg.x1 - sg.x0 > 4).map(sg => Object.assign(sg, { hp, max: hp, hitT: 0 }));
    g.obst.push({ kind: 'wall', y: -30, hx, hw, segs, hit: new Set() });
  }
}



function enemyMul(g) { return 1 + (g.mul - 1) * Math.min(1, g.t / 25); }

function spawnBlock(g, cx, w, rows, y0) {
  const em = enemyMul(g);
  
  const cols = Math.max(2, Math.min(Math.round(w / 16), 3 + g.stage + Math.floor(g.t / 6)));
  const grp = { cx, members: [] };
  g.groups.push(grp);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    
    const e = { kind: 'grunt', grp, ox: -(cols - 1) * 8 + c * 16 + rr(-3, 3), x: 0, y: y0 - r * 16 + rr(-4, 4), r: 7,
      hp: CONFIG.GRUNT_HP * em, max: CONFIG.GRUNT_HP * em, vy: CONFIG.ENEMY_VY + rr(-9, 9), bite: 1, burn: 0, burnD: 0,
      k: rr(2, 6), wob: rr(2, 7), wf: rr(1.2, 3.2), ph: rr(0, 6.28) };
    e.x = clamp(cx + e.ox, 22, 338);
    grp.members.push(e); g.enemies.push(e);
  }
}
function spawnWave(g) {
  const s = g.stage, mul = enemyMul(g);
  
  spawnBlock(g, rr(90, 270), rr(120, 300), 1 + Math.min(3, Math.floor(g.t / 18) + Math.floor((s - 1) / 2)), -20);   
  if (s >= 2 && rng() < 0.5) {   
    g.enemies.push({ kind: 'brute', x: rr(70, 290), y: -40, r: 17,
      hp: CONFIG.BRUTE_HP * mul, max: CONFIG.BRUTE_HP * mul, vy: 8, bite: 6, burn: 0, burnD: 0 });
  }
  if (rng() < (s >= 2 ? 0.55 : 0.25)) {   
    g.enemies.push({ kind: 'shooter', x: rr(50, 310), y: -20, r: 9, cd: rr(0.5, 1.5),
      hp: CONFIG.SHOOTER_HP * mul, max: CONFIG.SHOOTER_HP * mul, vy: 5, bite: 2, burn: 0, burnD: 0 });
  }
}

function newLanes(g) {
  
  g.lanes = g.lanes.map(() => rr(0.8, 1.9));
  const thin = ri(0, CONFIG.LANES - 1);
  g.lanes[thin] = 0.05;
  if (rng() < 0.5) g.lanes[(thin + ri(2, 3)) % CONFIG.LANES] = 0.15;
  g.laneT = rr(3, 5);
}
function spawnStream(g, dt, mult) {
  const C = CONFIG, em = enemyMul(g);
  const rate = C.STREAM_RATE * (1 + 0.25 * (g.stage - 1)) * (0.6 + 0.4 * Math.min(1, g.segT / 6)) * (mult || 1);
  g.streamAcc += dt * rate;
  const laneW = (C.ROAD_R - C.ROAD_L) / C.LANES, total = g.lanes.reduce((a, b) => a + b, 0);
  while (g.streamAcc >= 1) {
    g.streamAcc -= 1;
    let r = rng() * total, lane = 0;
    while (lane < C.LANES - 1 && (r -= g.lanes[lane]) > 0) lane++;
    const x = C.ROAD_L + laneW * (lane + rr(0.15, 0.85));
    const roll = rng();
    if (g.stage >= 2 && roll < 0.04 + 0.01 * g.stage)
      g.enemies.push({ kind: 'brute', x, y: -30, r: 17, hp: C.BRUTE_HP * em, max: C.BRUTE_HP * em, vy: 20, bite: 6, burn: 0, burnD: 0, hk: 0.5 });
    else if (roll > 0.96)

function spawnHorde(g, y0) {

function spawnTire(g, x, w, y, mulHp) {

function stageFlow(g, dt) {
  const C = CONFIG;

    }

      spawnTire(g, rr(C.ROAD_L + 40, C.ROAD_R - 40), rr(60, 80), -40);
      g.tireT = rr(2.5, 4);
    }
    if ((g.miniT -= dt) <= 0 && g.encDone >= 1 && g.encDone < g.encs) {

      for (let k = 0; k < ri(3, 5); k++)
        g.enemies.push({ kind: 'grunt', x: clamp(x0 + rr(-25, 25), 20, 340), y: -20 - rr(0, 30), r: 7, hp: C.GRUNT_HP * em, max: C.GRUNT_HP * em,
          vy: C.ENEMY_VY + rr(-4, 8), bite: 1, burn: 0, burnD: 0, hk: rr(0.7, 1.3), wob: rr(0.5, 3), wf: rr(1.2, 3), ph: rr(0, 6.28) });

    }

    spawnStream(g, dt);
    if ((g.laneT -= dt) <= 0) newLanes(g);
    if ((g.nextObst -= dt) <= 0) { spawnObstacle(g); g.nextObst = rr(4, 6.5); }
    if (g.segT >= C.SEG_COMBAT) {

  } else if (g.phase === 'preboss') {
    if (g.enemies.length === 0 && g.gates.length === 0 && g.obst.length === 0) { spawnBoss(g); g.phase = 'boss'; g.segT = 0; newLanes(g); }
  } else if (g.phase === 'boss') {
    
    if (g.boss && g.boss.y >= 100) spawnStream(g, dt, 0.8);

  }
}

const LANE_W = (CONFIG.ROAD_R - CONFIG.ROAD_L) / 3;
function laneOf(x) { return clamp(Math.floor((x - CONFIG.ROAD_L) / LANE_W), 0, 2); }
function laneX(i) { return CONFIG.ROAD_L + LANE_W * (i + 0.5); }
function slotBlue(g) {
  const sc = 1 + 0.3 * (g.stage - 1), r = rng();
  if (r < 0.06) return { type: 'mul', v: 2, good: true, hitT: 0 };
  
  const k = Math.round(rr(4, 10) * sc);
  return { type: 'add', v: k, max: Infinity, good: true, hitT: 0 };
}
function slotRed(g) {
  const sc = 1 + 0.3 * (g.stage - 1);
  if (rng() < 0.1) return { type: 'div', v: 2, charge: 0, need: CONFIG.DIV_NEED, good: false, hitT: 0 };
  const k = Math.max(3, Math.round(rr(CONFIG.RED_MIN, CONFIG.RED_MAX) * sc * (g.ramp || 1)));   
  return { type: 'add', v: -k, max: Infinity, good: false, hitT: 0 };   
}


function tireCost(t) { return Math.max(0, Math.ceil(t.hp / CONFIG.TIRE_PER)); }
function slotTire(g, m) { const hp = Math.round((CONFIG.TIRE_BASE + CONFIG.TIRE_HP * (g.chunk || 0)) * g.mul * (m || 1)); return { type: 'tire', hp, max: hp, hitT: 0, coinAcc: 0 }; }
function shuffle3(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildTrack(g) {
  
  const C = CONFIG, G = C.TRACK_GAP, T = [];
  let d = 0;
  const chunks = C.CHUNKS + Math.floor((g.stage - 1) / 2);
  for (let c = 0; c < chunks; c++) {
    
    g.ramp = Math.min(1, 0.4 + 0.15 * c); g.chunk = c;
    const two = rng() < 0.2 + 0.04 * c;
    const l1 = ri(0, 2), l2 = (l1 + ri(1, 2)) % 3;
    
    T.push({ dist: d += (c === 0 ? 80 : G * 0.8), kind: 'squad', lanes: two && c >= 2 ? [l1, l2] : [l1], cols: Math.min(6, 1 + c),
             rows: (c < 2 ? 1 : C.SQUAD_ROWS) + Math.floor(c / 3) + Math.floor((g.stage - 1) / 2) });
    
    const r = rng();
    if (c >= 2 && r < 0.35) {
      const w = slotRed(g); w.v = Math.round(w.v * 2); w.wide = true;   
      T.push({ dist: d += G, kind: 'row', lanes: [w, w, w] });
    } else {
      const pat = c < 2 ? 1 : r < 0.65 ? 0 : r < 0.85 ? 1 : 2;
      const lanes = pat === 0 ? [slotRed(g), slotRed(g), slotTire(g)] : pat === 1 ? [slotBlue(g), slotRed(g), slotRed(g)] : [slotRed(g), slotBlue(g), slotTire(g)];
      T.push({ dist: d += G, kind: 'row', lanes: shuffle3(lanes) });
    }
    if (c % 3 === 2) {
      const open = ri(0, 2);
      T.push({ dist: d += G, kind: 'row', lanes: [0, 1, 2].map(i => i === open ? { type: 'empty' } : slotTire(g)) });
      T.push({ dist: d + 40, kind: 'squad', lanes: [open], rows: 1 + Math.floor(c / 3) });   
    }
  }
  g.ramp = 1; g.chunk = chunks;
  
  for (let r = 0; r < 3; r++) T.push({ dist: d += G * 0.7, kind: 'row', lanes: [0, 1, 2].map(() => slotTire(g, 0.25 + 0.1 * r)) });   
  T.push({ dist: d += G, kind: 'boss' });
  return T;
}
function spawnSquad(g, lane, rows, cols) {
  cols = cols || 6;
  const C = CONFIG, em = enemyMul(g), x0 = laneX(lane) - LANE_W * 0.4;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    g.enemies.push({ kind: 'grunt', x: x0 + (c + 0.5) * (LANE_W * 0.8 / cols) + rr(-2, 2), y: -30 - r * 14, r: 7,
      hp: C.GRUNT_HP * em, max: C.GRUNT_HP * em, vy: C.HORDE_VY + rr(-3, 3), bite: 1, burn: 0, burnD: 0,
      hk: rr(0.6, 1.2), wob: rr(0.5, 2.5), wf: rr(1.2, 3), ph: rr(0, 6.28) });
}
function trackFlow(g, dt, scroll) {
  if (!g.track) { g.track = buildTrack(g); g.trackEnd = g.track[g.track.length - 1].dist; }
  if (!g.boss) g.dist += scroll * dt;
  while (g.ti < g.track.length && g.dist >= g.track[g.ti].dist) {
    const sp = g.track[g.ti];
    if (sp.kind === 'row') {
      
      if (sp.lanes[0].wide && !sp.lanes[0].scaled) { sp.lanes[0].v -= Math.round(g.N * CONFIG.WIDE_ARMY); sp.lanes[0].scaled = true; }

function spawnBoss(g) {

}


function update(g, dt) {
  if (g.over) return;
  g.t += dt;
  const C = CONFIG;
  
  const scroll = g.boss ? C.SCROLL * C.BOSS_SCROLL : C.SCROLL;   

  
  
  const half = formW(g) / 2;
  g.target = clamp(g.target, C.ROAD_L + half, C.ROAD_R - half);
  g.lx += clamp(g.target - g.lx, -C.MOVE_SPEED * dt, C.MOVE_SPEED * dt);

  layoutCrowd(g, dt);
  const R = crowdR(g), cy = C.LEADER_Y + g.cDepth / 2;   
  
  g.guards = g.guards.filter(gd => gd.hp > 0);
  for (let i = 0; i < g.guards.length; i++) {
    const row = Math.floor(i / 8), inRow = Math.min(8, g.guards.length - row * 8), col = i % 8;
    const tx = clamp(g.lx + (col - (inRow - 1) / 2) * 12, C.ROAD_L + 6, C.ROAD_R - 6), ty = C.LEADER_Y - 12 - row * 12;
    const gd = g.guards[i], k = Math.min(1, dt * 12);
    gd.x += (tx - gd.x) * k; gd.y += (ty - gd.y) * k;
  }

  
  trackFlow(g, dt, scroll);   

  
  for (const row of g.rows) {
    row.y += scroll * dt;
    for (const sl of row.lanes) if (sl.hitT > 0) sl.hitT -= dt;
    if (!row.done && row.y >= C.LEADER_Y) {
      row.done = true; g.gatesPassed++;
      const li = laneOf(g.lx), sl = row.lanes[li];
      row.picked = li;
      
      for (let i = 0; i < 3; i++) {
        const t = row.lanes[i];
        if (t.type !== 'tire' || t.hp <= 0) continue;
        let inLane = 0;
        for (const u of g.units) if (laneOf(u.x) === i) inLane += u.w;
        if (inLane <= 0) continue;
        const cost = tireCost(t), lost = Math.min(inLane, cost, g.N);
        t.hp = lost >= cost ? 0 : t.hp - lost * C.TIRE_PER;
        g.stats.lostBarr += lost;
        if (!SIM) { burst(laneX(i), row.y, '#555', 24); shake(8); popText(laneX(i), row.y - 30, '−' + lost, '#ff5a6a', 24); }
        loseUnits(g, lost, 'lostObst', laneX(i), row.y - 20);
        if (g.over) return;
      }
      
      const inL = [0, 0, 0]; let tot = 0;
      for (const u of g.units) { inL[laneOf(u.x)] += u.w; tot += u.w; }
      const hits = [...new Set([0, 1, 2].filter(i => inL[i] > 0 && inL[i] >= tot * 0.2).map(i => row.lanes[i]))]   
        .filter(x => x.type !== 'tire' && x.type !== 'empty')
        .sort((a, b) => (a.type === 'mul' || a.type === 'div') - (b.type === 'mul' || b.type === 'div'));
      hits.forEach((x, k) => {
        applyGate(g, x);
        if (!SIM) { popText(g.lx + (k - (hits.length - 1) / 2) * 40, C.LEADER_Y - 40 - k * 16, gateLabel(x), x.good ? '#fff' : '#ff5a6a'); sfx(x.good ? 'gate' : 'bad'); }
      });
      if (hits.length >= 2) g.slips++;
    }
  }
  g.rows = g.rows.filter(r => r.y < C.H + 40);

  
  for (const gt of g.gates) {
    gt.y += scroll * dt;
    if (!gt.done && gt.y >= C.LEADER_Y) {
      gt.done = true; g.gatesPassed++;
      const gx = gapX(gt, g.t), half = C.GAP_W / 2;
      let picked;
      if (gt.both && Math.abs(g.lx - gx) <= half) {
        
        const both = [gt.L, gt.R].sort((a, b) => (a.type === 'mul' || a.type === 'div') - (b.type === 'mul' || b.type === 'div'));
        for (const s of both) applyGate(g, s);
        g.slips++; g.coins += C.SLIP_COINS;
        picked = 'both';
        if (!SIM) { slipFx(gx); }
      } else {
        const side = g.lx < gx ? gt.L : gt.R;
        applyGate(g, side);
        picked = side;
        if (!SIM && side.type !== 'none') { popText(g.lx, C.LEADER_Y - 40, gateLabel(side), side.type === 'hire' ? PROPS[side.prop].color : side.good ? '#fff' : '#ff5a6a'); sfx(side.good ? 'gate' : 'bad'); }
      }
      gt.picked = picked;
    }
  }
  g.gates = g.gates.filter(gt => gt.y < C.H + 40);

  
  for (const o of g.obst) {
    o.y += scroll * dt;
    if (o.kind === 'saw') {
      o.x += o.vx * dt;
      if (o.x < 40 || o.x > 320) o.vx *= -1;
    }
    if (o.kind === 'barr') {
      if (o.hitT > 0) o.hitT -= dt;
      if (o.dead || o.y < C.LEADER_Y - 30 || o.y > C.LEADER_Y + g.cDepth + 10) continue;
      
      for (const gd of g.guards) if (gd.hp > 0 && gd.x > o.x0 - 6 && gd.x < o.x1 + 6 && Math.abs(gd.y - o.y) < 12) { gd.hp = 0; o.hp -= 40; if (!SIM) burst(gd.x, gd.y, PROPS.SHIELD.color, 8); }
      
      const u = g.lx > o.x0 && g.lx < o.x1 && o.y >= C.LEADER_Y - 12;
      if (o.hp <= 0) { o.dead = true; continue; }
      if (u) {
        const cost = Math.ceil(o.hp / (C.BARR_PER_UNIT * enemyMul(g)));
        o.dead = true;
        if (!SIM) { burst((o.x0 + o.x1) / 2, o.y, '#c9d2e3', 30); shake(8); }
        g.stats.lostBarr += cost; loseUnits(g, cost, 'lostObst', g.lx, o.y - 20);
        if (g.over) return;
      }
      continue;
    }
    if (Math.abs(o.y - C.LEADER_Y) > 80) continue;
    
    if (o.kind === 'saw' && (o.cd = (o.cd || 0) - dt) > 0) continue;
    
    if (o.kind === 'wall') {
      if (o.done || o.y < C.LEADER_Y) continue;
      o.done = true;
    }
    const lost = { FIRE: 0, SPLIT: 0, ROCKET: 0, '': 0 };
    for (let i = 0; i < g.units.length; i++) {
      if (o.hit.has(i)) continue;
      const u = g.units[i];
      let hit = false;
      if (o.kind === 'saw') hit = Math.hypot(u.x - o.x, u.y - o.y) < o.r + u.d / 2 - 1;
      else hit = Math.abs(u.y - o.y) < 6 + u.d / 2 - 4 && wallAt(o, u.x, 0);
      if (hit) { o.hit.add(i); lost[u.type] += u.w; if (!SIM) burst(u.x, u.y, '#9ab', 3); if (o.kind === 'saw') { o.cd = 0.12; break; } }
    }
    for (const gd of g.guards) {
      if (gd.hp <= 0) continue;
      if (o.kind === 'saw' ? Math.hypot(gd.x - o.x, gd.y - o.y) < o.r + 6 : Math.abs(gd.y - o.y) < 8 && wallAt(o, gd.x, 0)) { gd.hp = 0; if (!SIM) burst(gd.x, gd.y, PROPS.SHIELD.color, 8); }
    }
    for (const t in lost) if (lost[t] > 0) { g.stats[o.kind === 'saw' ? 'lostSaw' : 'lostWall'] += lost[t]; loseUnits(g, lost[t], 'lostObst', o.kind === 'saw' ? o.x : g.lx, o.y - 10, t); }
    if (g.over) return;
  }
  g.obst = g.obst.filter(o => o.y < C.H + 40 && !o.dead);

  
  const P = C.UNIT_DPS * g.power;
  
  
  let dps = normalN(g) * P * g.rateMul, fired = 0;
  g.shotAcc = g.shotAcc || [];
  for (let i = 0; i < g.units.length; i++) {
    const u = g.units[i];
    if (u.type) continue;
    if (g.shotAcc[i] == null) g.shotAcc[i] = rr(0, 1);
    g.shotAcc[i] -= dt * C.SHOT_RATE * g.rateMul;
    if (g.shotAcc[i] <= 0) {
      g.shotAcc[i] += 1;
      if (g.bullets.length < 600) { g.bullets.push({ x: u.x, y: u.y - 4, vx: 0, vy: -560, dmg: u.w * P / C.SHOT_RATE, r: 1.5 }); fired++; }
    }
  }
  if (!SIM && fired && rng() < 0.3) sfx('shot');
  const streams = [['', 0, 1, [C.RATE_BASE, C.RATE_SQRT], 10], ['SPLIT', g.typ.SPLIT, C.SPLIT_POWER, [0.6, 0.5], 8],
                   ['FIRE', g.typ.FIRE, C.FIRE_POWER, [5, 2], 18], ['ROCKET', g.typ.ROCKET, C.ROCKET_POWER, [0.45, 0.35], 4]];
  for (const [t, cnt, pw, rk, cap] of streams) {
    if (cnt <= 0) continue;
    
    const tdps = cnt * P * pw * g.rateMul;
    const bps = clamp((rk[0] + rk[1] * Math.sqrt(cnt)) * g.rateMul, 0.4, cap), dmg = tdps / bps;
    dps += tdps;
    g.fireAcc[t] = (g.fireAcc[t] || 0) + dt * bps;
    let shooters = null;
    while (g.fireAcc[t] >= 1) {
      g.fireAcc[t] -= 1;
      shooters = shooters || g.units.filter(u => u.type === t);
      if (!shooters.length) break;
      const u = shooters[ri(0, shooters.length - 1)];
      if (g.bullets.length >= 450) continue;
      if (t === 'FIRE')          
        g.bullets.push({ x: u.x + rr(-3, 3), y: u.y - 6, vx: rr(-60, 60), vy: -330, dmg, flame: true, fire: true, life: 0.42, r: 5, hitSet: new Set() });
      else if (t === 'SPLIT')    
        for (const a of [-0.22, 0, 0.22]) g.bullets.push({ x: u.x, y: u.y - 4, vx: Math.sin(a) * 540, vy: -Math.cos(a) * 540, dmg: dmg * 0.4, pellet: true, r: 1.8 });
      else if (t === 'ROCKET')   
        g.bullets.push({ x: u.x, y: u.y - 6, vx: 0, vy: -300, dmg, rocket: true, r: 3.5 });
      else g.bullets.push({ x: u.x, y: u.y - 4, vx: 0, vy: -560, dmg, r: 1.5 });
      if (!SIM && rng() < (t === 'ROCKET' ? 1 : t === 'FIRE' ? 0.15 : 0.12)) sfx(t === 'ROCKET' ? 'fireball' : 'shot');
    }
  }

  
  if (hasCombo(g, 'BURN AURA')) {
    for (const e of g.enemies) if (Math.hypot(e.x - g.lx, e.y - cy) < R + 34) { e.burn = Math.max(e.burn, 1.0); e.burnD = Math.max(e.burnD, dps * 0.15); }
  }

  
  for (const b of g.bullets) {
    b.py = b.y;   
    b.x += b.vx * dt; b.y += b.vy * dt;
    const targets = g.boss ? g.enemies.concat([g.boss]) : g.enemies;
    for (const e of targets) {
      if (b.dead || e.hp <= 0) continue;
      if (b.hitSet && b.hitSet.has(e)) continue;

    const want = s => s.type === 'mul' || s.type === 'none' ? 0 : s.type === 'div' ? (s.good ? 0 : 20) : s.v >= s.max ? 0 : !s.good ? 20 : s.type === 'hire' ? 10 : 5;

  }
  
  if (!next && bot === 'smart') {
    let best = g.lx, bestC = 1e9;

      for (const e of g.enemies) if (e.y > C.LEADER_Y - 220 && e.y < C.LEADER_Y && Math.abs(e.x - x) < 46) c += e.kind === 'brute' ? 6 : 1;

    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(20, 392, 320, 46);
    txt(P.icon + ' ' + P.name + ' Lv' + pickup.lv, 180, 405, 15, P.color);
    txt(P.pickup, 180, 426, 13, '#fff', 'center', '600');
    ctx.globalAlpha = 1;
    if (pickup.life <= 0) pickup = null;
  }
  if (slipFlash > 0) { slipFlash -= dt; ctx.fillStyle = `rgba(255,243,107,${slipFlash * 0.35})`; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H); }
  if (bannerFx) {
    bannerFx.life -= dt;
    const c = bannerFx.c, a = Math.min(1, bannerFx.life / 0.4), s = 1 + Math.max(0, bannerFx.life - 1.9) * 2;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 230, CONFIG.W, 110);
    txt('EVOLVE!', 180, 256, 20 * s, '#fff36b');
    txt(c.name, 180, 290, 30 * s, PROPS[c.a].color);
    txt(c.desc, 180, 322, 13, '#fff', 'center', '600');
    ctx.globalAlpha = 1;
    if (bannerFx.life <= 0) bannerFx = null;
  }
}
function drawMute() {
  const b = MUTE_BTN;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(b.x, b.y, b.w, b.h);
  txt(muted ? '🔇' : '🔊', b.x + b.w / 2, b.y + b.h / 2 + 1, 16, '#fff');
}
function drawTitle() {
  drawRoad();
  txt('WARS', 180, 190, 52, '#fff36b');   
  txt('shoot RED gates to turn them BLUE', 180, 232, 14, '#fff', 'center', '600');
  
  const t = performance.now() / 1000, hx = 180 + Math.sin(t * 2) * 60;
  const dv = Math.round(-9 + ((t * 5) % 20));
  ctx.fillStyle = dv >= 0 ? '#3fa9ff88' : '#ff4d5e88'; ctx.fillRect(90, 330, 180, 40);
  txt(dv >= 0 ? '+' + dv : '−' + (-dv), 180, 350, 20, '#fff');
  ctx.fillStyle = '#e8f4ff'; for (let k = 0; k < 3; k++) ctx.fillRect(178, 372 + ((t * 160 + k * 16) % 40), 3, 8);
  ctx.fillStyle = '#6fc3ff'; ctx.beginPath(); ctx.arc(hx, 420, 8, 0, 6.28); ctx.fill();
  txt('◀  drag  ▶', 180, 460, 16, '#fff');
  txt('STAGE ' + meta.stage + '    ● ' + meta.coins, 180, 520, 16, '#ffd84a');
  const blink = Math.floor(t * 2) % 2;
  if (blink) txt('TAP TO START', 180, 570, 20, '#fff');
  txt(VERSION, 8, 630, 10, '#667', 'left', 'normal');
  txt(saveOK ? 'SAVE ○' : 'SAVE ✕ (progress will not be kept)', 352, 630, 10, saveOK ? '#667' : '#ff8a8a', 'right', 'normal');
  { const b = RESET_BTN, armed = resetArm > performance.now();   
    ctx.fillStyle = armed ? '#7a2230' : 'rgba(255,255,255,0.08)'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = armed ? '#ff5a6a' : '#3a4260'; ctx.lineWidth = 1; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
    txt(armed ? 'TAP AGAIN TO ERASE' : 'RESET SAVE', b.x + b.w / 2, b.y + b.h / 2 + 1, 9, armed ? '#fff' : '#8890a8', 'center', '600'); }
}
function drawResult() {
  const r = resultInfo;
  drawRoad();
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
  txt(r.cleared ? 'STAGE CLEAR!' : 'DEFEATED', 180, 90, 34, r.cleared ? '#fff36b' : '#ff5a6a');
  txt('● +' + r.coins + '   (total ' + meta.coins + ')', 180, 132, 16, '#ffd84a');
  txt('SLIP ' + r.slips + '    KILLS ' + r.kills, 180, 158, 13, '#fff', 'center', '600');
  if (r.combos.length) txt('★ ' + r.combos.join('  ★ '), 180, 180, 12, '#fff36b', 'center', '600');
  txt(r.cleared ? 'Power up for the next stage' : 'Power up and try again', 180, 214, 14, '#fff', 'center', '600');
  buttons = [];
  
  SHOP.forEach((s, i) => {
    const done = s.once && s.once(meta), cost = s.cost(meta), can = !done && meta.coins >= cost;
    const b = { x: i % 2 ? 184 : 40, y: 236 + Math.floor(i / 2) * 64, w: 136, h: 56, fn: () => { if (!can) return; meta.coins -= cost; s.buy(meta); saveMeta(); sfx('buy'); } };
    ctx.fillStyle = done ? '#2a3a2e' : can ? '#2f5d9e' : '#2a2f44'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = can ? '#6fc3ff' : '#3a4260'; ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    const lv = s.lv(meta), cx = b.x + b.w / 2;
    txt(s.label, cx, b.y + 18, 13, '#fff');
    txt(done ? 'OWNED' : (typeof lv === 'number' ? 'Lv' + lv + '   ' : '') + '● ' + cost, cx, b.y + 39, 13, done ? '#7dff9b' : can ? '#ffd84a' : '#8890a8');
    buttons.push(b);
  });
  const go = { x: 60, y: 510, w: 240, h: 64, fn: () => startRun() };
  ctx.fillStyle = '#ffd84a'; ctx.fillRect(go.x, go.y, go.w, go.h);
  txt(r.cleared ? 'NEXT STAGE ' + meta.stage : 'RETRY', 180, go.y + 32, 24, '#1a1f33');
  buttons.push(go);
}

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#101320'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { shakeT -= dt; sx = (Math.random() - 0.5) * shakeA * 2; sy = (Math.random() - 0.5) * shakeA * 2; } else shakeA = 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx * scale), dpr * (offY + sy * scale));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, CONFIG.W, CONFIG.H); ctx.clip();

  if (scene === 'title') drawTitle();
  else if (scene === 'result') drawResult();
  else if (scene === 'play') {
    const g = game;
    if (!paused) {
      if (keys.ArrowLeft || keys.KeyA) g.target -= CONFIG.KEY_SPEED * dt;
      if (keys.ArrowRight || keys.KeyD) g.target += CONFIG.KEY_SPEED * dt;
      let gdt = dt;
      if (hitstop > 0) { hitstop -= dt; gdt = dt * 0.15; }
      update(g, gdt);
      bgY += CONFIG.SCROLL * (g.boss ? CONFIG.BOSS_SCROLL : 1) * gdt;
    }
    drawRoad(); drawGates(g, paused ? 0 : dt); drawRows(g, paused ? 0 : dt); drawObst(g); drawEnemies(g); drawBullets(g); drawCrowd(g); drawFx(paused ? 0 : dt); drawHud(g);
    if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H); txt('PAUSED', 180, 300, 30, '#fff'); txt('tap to resume', 180, 340, 14, '#fff'); }
    if (g.over) {
      if (!g.overT) g.overT = 0;
      g.overT += dt;
      txt(g.over === 'clear' ? 'CLEAR!' : 'DEFEATED', 180, 300, 40, g.over === 'clear' ? '#fff36b' : '#ff5a6a');
      if (g.overT > 1.4) endRun();
    }
  }
  drawMute();
  ctx.restore();
  requestAnimationFrame(frame);
}
loadMeta();
requestAnimationFrame(frame);
</script>
