<script>

const VERSION = 'v26';

const CONFIG = {
  W: 360, H: 640,                 
  ROAD_L: 16, ROAD_R: 344,        
  LEADER_Y: 500,                  
  SCROLL: 115,                    
  KEY_SPEED: 280,                 
  
  MOVE_SPEED: 170,

  
  START_UNITS: 1,
  SHOT_RATE: 1.6,                 

  
  GATE_PER_SEC: 7,
  DIV_NEED: 30,                   
  BLUE_MIN: 8, BLUE_MAX: 24,      
  RED_MIN: 12, RED_MAX: 26,       
  MUL_RATE: 0.15,                 
  GATE_GROW: 0.15,                

  
  LEVEL_GROW: 1.22,               
  GRUNT_HP: 3, BRUTE_HP: 45,
  ENEMY_VY: 20,                   
  
  HOMING: 45, CHASE_RANGE: 150,

  
  TIRE_PER: 16,
  TIRE_BASE: 120, TIRE_HP: 40,    
  WEAPON_POW: 1,                  
  WEAPON_HP: 200, WEAPON_FIRST: 0.5,                

  BOSS_HP: 1000, CLASH: 25,       

  TRACK_GAP: 230,                 
  CHUNKS: 7,                      
  WIDE_RATE: 0.28,                
  WALL_RATE: 0.22,                
  LANE_RATE: 0.4,                 
  MON_BLUE: 1.3, MON_ROWS: 2,     

  
  UP_RATE: 0.10, UP_DMG: 0.12, UP_INCOME: 0.15,
  COST_BASE: 40, COST_GROW: 1.32, 

  VOLUME: 0.35,
};


function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const rr = (a, b) => a + (b - a) * rng();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;


const SAVE_KEY = 'wars_meta_v24';
const OLD_KEYS = ['surinuke_meta'];   
let saveOK = false;
function defaultMeta() { return { coins: 0, level: 1, lvRate: 0, lvDmg: 0, lvIncome: 0, lvArmy: 0 }; }
let meta = defaultMeta();
function loadMeta() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) meta = Object.assign(defaultMeta(), JSON.parse(s));
    localStorage.setItem(SAVE_KEY + '_t', '1');
    saveOK = localStorage.getItem(SAVE_KEY + '_t') === '1';   
  } catch (e) { saveOK = false; }
}
function saveMeta() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) { saveOK = false; }
}

const RESET_BTN = { x: 250, y: 606, w: 102, h: 22 };
let resetArm = 0;
function resetMeta() {
  meta = defaultMeta();
  try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_KEY + '_t'); for (const k of OLD_KEYS) localStorage.removeItem(k), localStorage.removeItem(k + '_t'); } catch (e) { saveOK = false; }
  saveMeta();
}

const SHOP = [
  { key: 'lvRate',   label: ['FIRE', 'RATE'],  col: '#6fc3ff', eff: lv => '+' + Math.round(CONFIG.UP_RATE * 100 * lv) + '%' },
  { key: 'lvDmg',    label: ['DAMAGE', ''],    col: '#ff8a5a', eff: lv => '+' + Math.round(CONFIG.UP_DMG * 100 * lv) + '%' },
  { key: 'lvIncome', label: ['INCOME', ''],    col: '#ffd84a', eff: lv => '+' + Math.round(CONFIG.UP_INCOME * 100 * lv) + '%' },
  { key: 'lvArmy',   label: ['+1', 'SOLDIER'], col: '#7dff9b', eff: lv => (CONFIG.START_UNITS + lv) + ' start' },
];
function shopCost(s, m) { return Math.round(CONFIG.COST_BASE * Math.pow(CONFIG.COST_GROW, m[s.key])); }


function newRun(level, m, seed) {
  rng = mulberry32(seed == null ? (Date.now() & 0xffffffff) : seed);
  const C = CONFIG;
  const g = {
    level, mul: Math.pow(C.LEVEL_GROW, level - 1), sc: 1 + C.GATE_GROW * (level - 1),
    t: 0, over: null,
    N: C.START_UNITS + m.lvArmy,
    power: 1 + C.UP_DMG * m.lvDmg, rateMul: 1 + C.UP_RATE * m.lvRate, income: 1 + C.UP_INCOME * m.lvIncome,
    wlv: 0, lock: null,
    lx: 180, target: 180, units: [], cR: 10, cDepth: 10, shotAcc: [],
    bullets: [], enemies: [], rows: [], walls: [], boss: null,
    dist: 0, ti: 0, track: null, trackEnd: 1, chunk: 0, ramp: 1,
    coins: 0, coinAcc: 0, kills: 0, peak: 0,
    stats: { gate: 0, enemy: 0, tire: 0, boss: 0 },
    wGot: 0, wMiss: 0,   
  };
  g.peak = g.N;
  return g;
}


const SIZE = { 1: 8, 10: 13, 100: 20 };
function crowdItems(g) {
  const items = [];
  let n = Math.round(g.N);
  const tiers = n >= 300 ? [100, 10, 1] : n >= 120 ? [10, 1] : [1];
  for (const t of tiers) {
    const c = t === 1 ? n : Math.floor(n / t);
    for (let k = 0; k < c && items.length < 240; k++) items.push({ w: t, d: SIZE[t] });
    n -= c * t;
  }
  return items;
}

function formW(g) {
  const w = clamp(20 + 12 * Math.sqrt(Math.max(1, g.N)), 20, 142);
  return g.lock != null ? Math.min(w, LANE_W - 12) : w;
}
function layoutCrowd(g, dt) {
  const C = CONFIG, items = crowdItems(g), rowW = formW(g);
  const rows = []; let row = [], x = 0, y = C.LEADER_Y, h = 0;
  for (const it of items) {
    if (x + it.d > rowW && row.length) { rows.push({ row, w: x, y, h }); y += h; row = []; x = 0; h = 0; }
    it.ox = x + it.d / 2; x += it.d; h = Math.max(h, it.d); row.push(it);
  }
  if (row.length) rows.push({ row, w: x, y, h });
  const old = g.units, k = Math.min(1, dt * 20);
  let i = 0;
  for (const r of rows) for (const it of r.row) {
    const o = old[i++];
    const tx = clamp(g.lx - r.w / 2 + it.ox, C.ROAD_L + 3, C.ROAD_R - 3), ty = r.y + r.h / 2;
    it.x = o ? o.x : g.lx; it.y = o ? o.y : C.LEADER_Y + 20;
    it.x += (tx - it.x) * k; it.y += (ty - it.y) * k;
  }
  g.units = items;
  g.cR = rowW / 2; g.cDepth = rows.length ? y + h - C.LEADER_Y : 8;
}
function loseUnits(g, n, why, x, y) {
  n = Math.min(g.N, Math.max(0, Math.round(n)));
  if (n <= 0) return;
  g.N -= n; g.stats[why] += n;
  if (!SIM) { popText(x, y, '−' + n, '#ff5a6a', 18); sfx('lose'); shake(3); }
  if (g.N <= 0) { g.over = 'fail'; if (!SIM) sfx('fail'); }
}

function addCoins(g, base, x, y) {
  g.coinAcc += base * g.income;
  const v = Math.floor(g.coinAcc);
  if (v <= 0) return;
  g.coinAcc -= v; g.coins += v;
  if (!SIM) coinFx(x, y, v);
}


const LANE_W = (CONFIG.ROAD_R - CONFIG.ROAD_L) / 3;
function laneOf(x) { return clamp(Math.floor((x - CONFIG.ROAD_L) / LANE_W), 0, 2); }
function laneX(i) { return CONFIG.ROAD_L + LANE_W * (i + 0.5); }

function slotBlue(g, big, noMul) {
  
  if (!noMul && rng() < CONFIG.MUL_RATE) return { type: 'mul', v: 2, good: true, hitT: 0 };
  const k = Math.round(rr(CONFIG.BLUE_MIN, CONFIG.BLUE_MAX) * g.sc * (big || 1));
  return { type: 'add', v: k, good: true, hitT: 0 };
}
function slotRed(g, big) {
  if (rng() < 0.1) return { type: 'div', v: 2, charge: 0, need: CONFIG.DIV_NEED, good: false, hitT: 0 };
  const k = Math.max(3, Math.round(rr(CONFIG.RED_MIN, CONFIG.RED_MAX) * g.sc * g.ramp * (big || 1)));
  return { type: 'add', v: -k, good: false, hitT: 0 };
}

function slotTire(g, m) { const hp = Math.round((CONFIG.TIRE_BASE + CONFIG.TIRE_HP * g.chunk) * g.mul * (m || 1)); return { type: 'tire', hp, max: hp, hitT: 0, coinAcc: 0 }; }

const WEAPONS = [
  { name: 'GUN',     rate: 1.00, dmg: 1.00, color: '#e8f4ff' },
  { name: 'RIFLE',   rate: 1.25, dmg: 1.35, color: '#7fe0ff' },
  { name: 'BLASTER', rate: 1.50, dmg: 1.75, color: '#c98bff' },
  { name: 'LASER',   rate: 1.80, dmg: 2.20, color: '#ff8adf' },
];

function weapon(g) {
  const w = WEAPONS[Math.min(WEAPONS.length - 1, g.wlv)], k = CONFIG.WEAPON_POW;
  return { name: w.name, color: w.color, rate: Math.pow(w.rate, k), dmg: Math.pow(w.dmg, k) };
}

function slotWeaponTire(g) {
  const hp = Math.round(CONFIG.WEAPON_HP * g.mul * (g.wk === 0 ? CONFIG.WEAPON_FIRST : 1 + 0.5 * (g.wk - 1)));   
  g.wk++;
  return { type: 'tire', hp, max: hp, hitT: 0, coinAcc: 0, weapon: true };
}
function tireCost(t) { return Math.max(0, Math.ceil(t.hp / CONFIG.TIRE_PER)); }
function shuffle3(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }


function buildTrack(g) {
  const C = CONFIG, G = C.TRACK_GAP, T = [];
  let d = 0, theme = null, left = 0, up = 0, k = 0;
  g.wk = 0;
  const chunks = C.CHUNKS + Math.min(6, Math.floor((g.level - 1) / 2));
  for (let c = 0; c < chunks; c++) {
    
    g.ramp = Math.min(1, 0.4 + 0.15 * c); g.chunk = c;
    
    const rows = c < 2 ? 1 : 1 + Math.floor(c / 3) + Math.floor((g.level - 1) / 3);
    const cols = c < 2 ? c + 1 : Math.min(6, 1 + c + Math.floor(g.level / 3));
    if (left <= 0) {   
      const t = rng();
      theme = c < 2 ? 'open' : t < C.LANE_RATE ? 'lane' : t < C.LANE_RATE + C.WALL_RATE ? 'wall' : 'open';
      if (theme === 'wall' && c >= chunks - 1) theme = 'open';
      left = c < 2 ? 2 : theme === 'lane' ? 3 : theme === 'wall' ? 1 : 2;
      up = rng() < 0.5 ? 0 : 2; k = 0;
    }
    left--;
    const r = rng();
    if (theme === 'lane') {
      
      const mon = [0, 1, 2].filter(i => i !== up);
      T.push({ dist: d += G * 0.8, kind: 'squad', lanes: mon, rows: rows + C.MON_ROWS, cols: 5, brute: g.level >= 3 && k === 1 });
      const upSlot = k % 3 === 0 ? slotWeaponTire(g) : k % 3 === 1 ? slotBlue(g, 0.7, true) : slotRed(g, 0.6);
      const big = rng() < 0.5 ? 0 : 1;
      const lanes = [];
      lanes[up] = upSlot; lanes[mon[big]] = slotBlue(g, C.MON_BLUE); lanes[mon[1 - big]] = slotRed(g);
      T.push({ dist: d += G * 0.9, kind: 'row', lanes });
      k++;
      continue;
    }
    if (theme === 'wall') {
      
      T.push({ dist: d += G * 0.8, kind: 'squad', lanes: [ri(0, 2)], rows, cols });
      const plans = shuffle3([
        [slotBlue(g, 0.8), 'squad'],
        [slotRed(g, 1.3), { type: 'mul', v: 2, good: true, hitT: 0 }],
        [slotWeaponTire(g), slotBlue(g)],
      ]);
      const w0 = d + G * 0.9, len = 60 + G + 150;
      T.push({ dist: w0, kind: 'wall', len });
      T.push({ dist: w0 + 60, kind: 'row', lanes: plans.map(p => p[0]) });
      const second = plans.map(p => p[1] === 'squad' ? { type: 'empty' } : p[1]);
      T.push({ dist: w0 + 60 + G * 0.55, kind: 'squad', lanes: plans.map((p, i) => p[1] === 'squad' ? i : -1).filter(i => i >= 0), rows: rows + 1, cols: 5 });
      T.push({ dist: w0 + 60 + G, kind: 'row', lanes: second });
      d = w0 + len;
      continue;
    }
    
    if (c >= 2 && r < C.WIDE_RATE) {
      
      T.push({ dist: d += G * 0.8, kind: 'squad', lanes: [0, 1, 2], rows: rows + 1, cols: 5, brute: g.level >= 3 && rng() < 0.4 });
      const w = slotRed(g, 1.5); w.wide = true;
      T.push({ dist: d += 170, kind: 'row', lanes: [w, w, w] });
      continue;
    }
    T.push({ dist: d += (c === 0 ? 80 : G * 0.8), kind: 'squad', lanes: [ri(0, 2)], rows, cols, soft: c < 2 });
    if (c >= 2 && r < C.WIDE_RATE + 0.3) {
      
      const open = ri(0, 2), wl = (open + ri(1, 2)) % 3;
      T.push({ dist: d += G, kind: 'row', lanes: [0, 1, 2].map(i => i === open ? { type: 'empty' } : i === wl ? slotWeaponTire(g) : slotTire(g)) });
      T.push({ dist: d + 40, kind: 'squad', lanes: [open], rows: rows + 1, cols: 5 });
      continue;
    }
    
    const pat = c < 2 ? 1 : r < 0.8 ? 0 : r < 0.9 ? 1 : 2;
    const lanes = pat === 0 ? [slotRed(g), slotRed(g), slotTire(g)] : pat === 1 ? [slotBlue(g, 1, c < 2), slotRed(g), slotRed(g)] : [slotRed(g), slotBlue(g), slotTire(g)];   
    T.push({ dist: d += G, kind: 'row', lanes: shuffle3(lanes) });
  }
  g.ramp = 1; g.chunk = chunks;
  
  for (let r = 0; r < 3; r++) T.push({ dist: d += G * 0.7, kind: 'row', lanes: [0, 1, 2].map(() => slotTire(g, 0.25 + 0.1 * r)) });
  T.push({ dist: d += G, kind: 'boss' });
  return T;
}

function spawnSquad(g, lane, rows, cols, brute, soft) {
  const C = CONFIG, em = g.mul * (soft ? 0.5 : 1), x0 = laneX(lane) - LANE_W * 0.4;
  cols = cols || 6;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    g.enemies.push({ kind: 'grunt', lane, x: x0 + (c + 0.5) * (LANE_W * 0.8 / cols) + rr(-2, 2), y: -30 - r * 14, r: 7,
      hp: C.GRUNT_HP * em, max: C.GRUNT_HP * em, vy: C.ENEMY_VY + rr(-3, 3), bite: 1,
      hk: rr(0.6, 1.2), wob: rr(0.5, 2.5), wf: rr(1.2, 3), ph: rr(0, 6.28) });
  if (brute) g.enemies.push({ kind: 'brute', lane, x: laneX(lane), y: -40 - rows * 14, r: 15, hp: C.BRUTE_HP * em, max: C.BRUTE_HP * em, vy: C.ENEMY_VY, bite: 6, hk: 0.5 });
}
function trackFlow(g, dt, scroll) {
  if (!g.track) { g.track = buildTrack(g); g.trackEnd = g.track[g.track.length - 1].dist; }
  if (!g.boss) g.dist += scroll * dt;
  while (g.ti < g.track.length && g.dist >= g.track[g.ti].dist) {
    const sp = g.track[g.ti++];
    if (sp.kind === 'row') g.rows.push({ y: -40, lanes: sp.lanes, done: false });
    else if (sp.kind === 'wall') g.walls.push({ y: -40, len: sp.len, lane: null });
    else if (sp.kind === 'squad') sp.lanes.forEach((l, k) => spawnSquad(g, l, sp.rows, sp.cols, sp.brute && k === 1, sp.soft));
    else if (sp.kind === 'boss') spawnBoss(g);   
  }
}
function spawnBoss(g) {
  g.boss = { x: 180, y: -60, r: 46, hp: CONFIG.BOSS_HP * g.mul, max: CONFIG.BOSS_HP * g.mul, t: 0, flash: 0 };
  if (!SIM) { sfx('boss'); shake(6); }
}


function gateLabel(sd) {
  if (sd.type === 'add') { const v = Math.round(sd.v); return v >= 0 ? '+' + v : '−' + (-v); }
  if (sd.type === 'mul') return '×' + sd.v;
  return '÷' + sd.v;
}

function shootGate(g, sd, x, y) {
  sd.hitT = 0.08;
  if (sd.bt == null) { sd.bt = g.t; sd.bud = 1; }
  sd.bud = Math.min(CONFIG.GATE_PER_SEC, sd.bud + (g.t - sd.bt) * CONFIG.GATE_PER_SEC); sd.bt = g.t;
  if (sd.bud < 1) return;
  sd.bud -= 1;
  if (sd.type === 'add') {
    const before = sd.v;
    sd.v += 1;
    if (before < 0 && sd.v >= 0) flip(g, sd, x, y);
  } else if (sd.type === 'div' && !sd.good) {
    if (++sd.charge >= sd.need) { sd.type = 'mul'; sd.v = 2; flip(g, sd, x, y); }
  }
}
function flip(g, sd, x, y) {
  sd.good = true;
  if (!SIM) { burst(x, y, '#3fa9ff', 18); popText(x, y - 28, 'FLIP!', '#fff', 18); sfx('flip'); }
}
function applyGate(g, s) {
  const n0 = g.N;
  if (s.type === 'add') g.N = Math.max(0, g.N + Math.round(s.v));
  else if (s.type === 'mul') g.N = g.N * s.v;
  else if (s.type === 'div') g.N = Math.floor(g.N / s.v);
  if (g.N < n0) g.stats.gate += n0 - g.N;
  g.peak = Math.max(g.peak, g.N);
  if (g.N <= 0) { g.over = 'fail'; if (!SIM) sfx('fail'); }
}


function update(g, dt) {
  if (g.over) return;
  g.t += dt;
  const C = CONFIG, scroll = C.SCROLL;

  
  for (const w of g.walls) w.y += scroll * dt;
  g.walls = g.walls.filter(w => w.y - w.len < C.H + 20);
  const wIn = g.walls.find(w => w.y >= C.LEADER_Y - 6 && w.y - w.len <= C.LEADER_Y + g.cDepth);
  if (wIn) { if (wIn.lane == null) wIn.lane = laneOf(g.lx); g.lock = wIn.lane; }
  else g.lock = null;

  
  const half = formW(g) / 2;
  let lo = C.ROAD_L + half, hi = C.ROAD_R - half;
  if (g.lock != null) { lo = C.ROAD_L + LANE_W * g.lock + half + 2; hi = C.ROAD_L + LANE_W * (g.lock + 1) - half - 2; }
  g.target = clamp(g.target, lo, hi);
  g.lx += clamp(g.target - g.lx, -C.MOVE_SPEED * dt, C.MOVE_SPEED * dt);
  if (g.lock != null) g.lx = clamp(g.lx, lo, hi);
  layoutCrowd(g, dt);

  trackFlow(g, dt, scroll);

  
  for (const row of g.rows) {
    row.y += scroll * dt;
    for (const sl of row.lanes) if (sl.hitT > 0) sl.hitT -= dt;
    if (row.done || row.y < C.LEADER_Y) continue;
    row.done = true;
    for (const t of row.lanes) if (t.weapon && !t.got && !t.counted) { t.counted = true; g.wMiss++; }
    const inL = [0, 0, 0]; let tot = 0;
    for (const u of g.units) { inL[laneOf(u.x)] += u.w; tot += u.w; }
    
    for (let i = 0; i < 3; i++) {
      const t = row.lanes[i];
      if (t.type !== 'tire' || t.hp <= 0 || inL[i] <= 0) continue;
      const cost = tireCost(t), lost = Math.min(inL[i], cost, g.N);
      t.hp = lost >= cost ? 0 : t.hp - lost * C.TIRE_PER;
      if (!SIM) { burst(laneX(i), row.y, '#555', 24); shake(8); }
      loseUnits(g, lost, 'tire', laneX(i), row.y - 30);
      if (g.over) return;
    }
    
    const hits = [...new Set([0, 1, 2].filter(i => inL[i] > 0 && inL[i] >= tot * 0.2).map(i => row.lanes[i]))]
      .filter(x => x.type !== 'tire' && x.type !== 'empty')
      .sort((a, b) => (a.type !== 'add') - (b.type !== 'add'));   
    hits.forEach((x, k) => {
      applyGate(g, x);
      if (!SIM) { popText(g.lx + (k - (hits.length - 1) / 2) * 40, C.LEADER_Y - 40 - k * 16, gateLabel(x), x.good ? '#fff' : '#ff5a6a', 20); sfx(x.good ? 'gate' : 'bad'); }
    });
    row.picked = hits;
    if (g.over) return;
  }
  g.rows = g.rows.filter(r => r.y < C.H + 40);

  
  const W = weapon(g);
  let fired = 0;
  for (let i = 0; i < g.units.length; i++) {
    const u = g.units[i];
    if (g.shotAcc[i] == null) g.shotAcc[i] = rr(0, 1);
    g.shotAcc[i] -= dt * C.SHOT_RATE * g.rateMul * W.rate;
    if (g.shotAcc[i] <= 0) {
      g.shotAcc[i] += 1;
      if (g.bullets.length < 600) { g.bullets.push({ x: u.x, y: u.y - 4, vy: -560, dmg: u.w * g.power * W.dmg / C.SHOT_RATE, wc: W.color }); fired++; }
    }
  }
  if (!SIM && fired && rng() < 0.3) sfx('shot');

  
  for (const b of g.bullets) {
    b.py = b.y; b.y += b.vy * dt;
    const targets = g.boss ? g.enemies.concat([g.boss]) : g.enemies;
    for (const e of targets) {
      if (e.hp <= 0) continue;
      if (Math.abs(b.x - e.x) > e.r + 3 || Math.abs(b.y - e.y) > e.r + 6) continue;
      hurt(g, e, b.dmg); b.dead = true; break;
    }
    
    if (!b.dead) for (const row of g.rows) {
      if (row.done) continue;

    ctx.fillStyle = sl.hitT > 0 ? '#5a5f70' : '#1c1f28'; ctx.beginPath(); ctx.ellipse(cx, y + 10 - k * 8, rw, 11, 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#3a3f4e'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.fillStyle = '#6b7080'; ctx.beginPath(); ctx.ellipse(cx, y - 6, rw * 0.45, 4, 0, 0, 6.28); ctx.fill();
  txt(String(tireCost(sl)), cx, y + 24, sl.hitT > 0 ? 20 : 18, '#ff9a5a');   
  if (sl.weapon && g.wlv < WEAPONS.length - 1) {   
    
    const nx = WEAPONS[Math.min(WEAPONS.length - 1, g.wlv + 1)], gy = y - 30 + Math.sin(performance.now() / 200) * 2;
    ctx.fillStyle = '#0b0e18'; ctx.fillRect(cx - 17, gy - 6, 34, 12);
    ctx.fillStyle = nx.color; ctx.fillRect(cx - 15, gy - 4, 26, 6); ctx.fillRect(cx - 15, gy, 6, 8); ctx.fillRect(cx + 9, gy - 3, 7, 3);
    txt(nx.name, cx, gy - 13, 9, nx.color, 'center', '700');
    ctx.fillStyle = '#000b'; ctx.fillRect(cx - 24, gy + 11, 48, 5);
    ctx.fillStyle = '#5dff7a'; ctx.fillRect(cx - 24, gy + 11, 48 * (1 - sl.hp / sl.max), 5);
  }
}
function drawGateSide(x0, x1, y, s, taken, dt) {
  const col = s.good ? '#3fa9ff' : '#ff4d5e';
  if (s.hitT > 0) s.hitT -= dt;
  
  const H = 46, top = y - H;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x0, y - 1, x1 - x0, 5);
  ctx.globalAlpha = taken ? 0.15 : s.hitT > 0 ? 0.7 : 0.4;
  ctx.fillStyle = col; ctx.fillRect(x0 + 3, top + 3, x1 - x0 - 6, H - 3);
  ctx.globalAlpha = taken ? 0.4 : 1;
  ctx.fillStyle = col; ctx.fillRect(x0, top, 4, H + 2); ctx.fillRect(x1 - 4, top, 4, H + 2); ctx.fillRect(x0, top, x1 - x0, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(x0 + 4, y - 1, x1 - x0 - 8, 2);
  ctx.globalAlpha = 1;
  const cy = top + H * 0.5, cx = (x0 + x1) / 2;
  if (s.type === 'div') {
    txt('÷2', cx, cy - 4, 22, '#fff');
    ctx.fillStyle = '#000a'; ctx.fillRect(x0 + 8, cy + 12, x1 - x0 - 16, 5);
    ctx.fillStyle = '#3fa9ff'; ctx.fillRect(x0 + 8, cy + 12, (x1 - x0 - 16) * Math.min(1, s.charge / s.need), 5);
  } else txt(gateLabel(s), cx, cy, s.hitT > 0 ? 25 : 22, '#fff');
}
function drawEnemies(g) {
  for (const e of g.enemies) {
    const br = e.kind === 'brute';
    ctx.fillStyle = br ? '#ff8a3a' : '#ff4d5e';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.28); ctx.fill();
    ctx.fillStyle = br ? '#ffc08a' : '#ff9aa4';   
    ctx.beginPath(); ctx.moveTo(e.x - e.r * 0.8, e.y - e.r * 0.4); ctx.lineTo(e.x - e.r * 0.6, e.y - e.r * 1.3); ctx.lineTo(e.x - e.r * 0.2, e.y - e.r * 0.8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x + e.r * 0.8, e.y - e.r * 0.4); ctx.lineTo(e.x + e.r * 0.6, e.y - e.r * 1.3); ctx.lineTo(e.x + e.r * 0.2, e.y - e.r * 0.8); ctx.fill();
    ctx.fillStyle = '#1a1f33';
    ctx.fillRect(e.x - e.r * 0.45, e.y - e.r * 0.2, e.r * 0.3, e.r * 0.3); ctx.fillRect(e.x + e.r * 0.15, e.y - e.r * 0.2, e.r * 0.3, e.r * 0.3);
    if (br) {
      ctx.fillStyle = '#000a'; ctx.fillRect(e.x - e.r, e.y - e.r - 9, e.r * 2, 3);
      ctx.fillStyle = '#fff'; ctx.fillRect(e.x - e.r, e.y - e.r - 9, e.r * 2 * Math.max(0, e.hp / e.max), 3);
    }
  }
  const B = g.boss;
  if (B && B.hp > 0) {
    
    const sp = 14, t = performance.now() / 400;
    ctx.fillStyle = B.flash > 0 ? '#fff' : '#9e1f35';
    ctx.beginPath();
    for (let k = 0; k < sp * 2; k++) { const a = k * Math.PI / sp + t * 0.2, rad = k % 2 ? B.r : B.r + 12; ctx.lineTo(B.x + Math.cos(a) * rad, B.y + Math.sin(a) * rad); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = B.flash > 0 ? '#fff' : '#d8324a'; ctx.beginPath(); ctx.arc(B.x, B.y, B.r - 4, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#ffd84a'; ctx.fillRect(B.x - 20, B.y - 12, 12, 9); ctx.fillRect(B.x + 8, B.y - 12, 12, 9);
    ctx.fillStyle = '#1a1f33'; ctx.fillRect(B.x - 16, B.y + 6, 32, 6);
    txt(String(Math.max(0, Math.ceil(B.hp / CONFIG.CLASH))), B.x, B.y + 24, 20, '#fff');   
  }
}
function drawCrowd(g) {
  const C = CONFIG;
  for (let i = g.units.length - 1; i >= 0; i--) {
    const u = g.units[i], r = u.d / 2;
    ctx.fillStyle = '#0b0e18'; ctx.beginPath(); ctx.arc(u.x, u.y, r, 0, 6.28); ctx.fill();
    ctx.fillStyle = u.w >= 100 ? '#3d86e0' : u.w >= 10 ? '#56a6f2' : '#6fc3ff';
    ctx.beginPath(); ctx.arc(u.x, u.y - 0.5, r - 1.1, 0, 6.28); ctx.fill();
    ctx.fillStyle = weapon(g).color; ctx.fillRect(u.x + r * 0.3, u.y - r - 2, 2, r);   
    if (u.w >= 10) {
      ctx.fillStyle = '#ffd84a'; ctx.fillRect(u.x - r * 0.5, u.y - r + 0.5, r, Math.max(2, r * 0.25));
      if (u.w >= 100) txt('100', u.x, u.y + 1, 8, '#fff');
    }
  }
  ctx.fillStyle = '#fff';
  const top = C.LEADER_Y - 8;
  ctx.beginPath(); ctx.moveTo(g.lx, top); ctx.lineTo(g.lx - 6, top - 10); ctx.lineTo(g.lx + 6, top - 10); ctx.fill();
  txt(String(g.N), g.lx, top - 22, 18, '#fff');
}
function drawBullets(g) {
  for (const b of g.bullets) { ctx.fillStyle = b.wc; ctx.fillRect(b.x - 1.5, b.y - 5, 3, 8); }
}
function coinPill(x, y, v) {
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; rrect(x, y - 12, 26 + String(v).length * 9, 24, 12); ctx.fill();
  ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.arc(x + 12, y, 8, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(x + 12, y - 0.5, 6.5, 0, 6.28); ctx.fill();
  txt(String(v), x + 24, y + 1, 14, '#ffd84a', 'left');
}

function drawProgress(level, p) {
  const x0 = 64, x1 = 256, y = 24;
  ctx.fillStyle = '#000a'; rrect(x0, y - 5, x1 - x0, 10, 5); ctx.fill();
  ctx.fillStyle = '#ffd84a'; rrect(x0, y - 5, Math.max(10, (x1 - x0) * p), 10, 5); ctx.fill();
  for (const [x, n, on] of [[x0 - 14, level, true], [x1 + 14, level + 1, p >= 1]]) {
    ctx.fillStyle = on ? '#ffd84a' : '#2a3050'; ctx.beginPath(); ctx.arc(x, y, 14, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#0b0e18'; ctx.lineWidth = 2; ctx.stroke();
    txt(String(n), x, y + 1, 13, on ? '#1a1f33' : '#fff', 'center');
  }
  ctx.fillStyle = '#ddd'; ctx.fillRect(x1 + 26, y - 14, 2, 20);
  ctx.fillStyle = '#ff4d5e'; ctx.beginPath(); ctx.moveTo(x1 + 28, y - 14); ctx.lineTo(x1 + 40, y - 10); ctx.lineTo(x1 + 28, y - 6); ctx.fill();
}
function drawHud(g) {
  const B = g.boss;
  if (B) {
    txt('BOSS', 180, 16, 12, '#fff');
    ctx.fillStyle = '#000a'; ctx.fillRect(50, 26, 260, 10);
    ctx.fillStyle = '#ff4d5e'; ctx.fillRect(50, 26, 260 * Math.max(0, B.hp / B.max), 10);
  } else drawProgress(g.level, Math.min(1, g.dist / g.trackEnd));
  coinPill(10, 62, meta.coins + g.coins);
  txt(weapon(g).name + ' Lv' + (g.wlv + 1), 314, 74, 11, weapon(g).color, 'right', '700');
}
function drawCoinsFly(dt) {   
  for (const c of coinsFly) {
    c.t += dt;
    if (c.t < 0.25) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 300 * dt; }
    else { const k = Math.min(1, dt * 9); c.x += (22 - c.x) * k; c.y += (62 - c.y) * k; }
    ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.arc(c.x, c.y, 4.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(c.x, c.y - 0.5, 3.5, 0, 6.28); ctx.fill();
  }
  coinsFly = coinsFly.filter(c => c.t < 0.25 || Math.hypot(c.x - 22, c.y - 62) > 6);
}
function drawFx(dt) {
  drawCoinsFly(dt);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 0.3); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); }
  ctx.globalAlpha = 1;
  for (const r of rings) { r.life -= dt; ctx.strokeStyle = r.col; ctx.globalAlpha = Math.max(0, r.life / 0.3); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (1.3 - r.life), 0, 6.28); ctx.stroke(); }
  rings = rings.filter(r => r.life > 0); ctx.globalAlpha = 1;
  for (const t of texts) { t.life -= dt; t.y -= 40 * dt; ctx.globalAlpha = Math.min(1, t.life / 0.3); txt(t.s, t.x, t.y, t.size, t.col); }
  texts = texts.filter(t => t.life > 0); ctx.globalAlpha = 1;
  if (weaponBanner) {
    weaponBanner.life -= dt;
    const a = Math.min(1, weaponBanner.life / 0.4), s = 1 + Math.max(0, weaponBanner.life - 1.3) * 2;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 250, CONFIG.W, 70);
    txt('NEW WEAPON', 180, 268, 13, '#fff');
    txt(weaponBanner.w.name + '!', 180, 298, 28 * s, weaponBanner.w.color);
    ctx.globalAlpha = 1;
    if (weaponBanner.life <= 0) weaponBanner = null;
  }
}
function drawMute() {
  const b = MUTE_BTN;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rrect(b.x, b.y, b.w, b.h, 6); ctx.fill();
  txt(muted ? '🔇' : '🔊', b.x + b.w / 2, b.y + b.h / 2 + 1, 14, '#fff');
}

function drawMenu() {
  bgY += 20 / 60;
  drawRoad();
  coinPill(10, 24, meta.coins);
  txt('WARS', 180, 96, 44, '#fff36b');   
  txt('LEVEL ' + meta.level, 180, 150, 30, '#fff');
  
  const n = CONFIG.START_UNITS + meta.lvArmy, t = performance.now() / 1000;
  for (let k = 0; k < Math.min(n, 30); k++) {
    const x = 180 + ((k % 6) - (Math.min(n, 6) - 1) / 2) * 10, y = 300 + Math.floor(k / 6) * 10;
    ctx.fillStyle = '#0b0e18'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#6fc3ff'; ctx.beginPath(); ctx.arc(x, y - 0.5, 3, 0, 6.28); ctx.fill();
  }
  txt(String(n), 180, 276, 16, '#fff');
  ctx.fillStyle = '#e8f4ff'; for (let k = 0; k < 3; k++) ctx.fillRect(179, 196 + ((t * 160 + k * 22) % 66), 3, 8);
  const pulse = 1 + 0.04 * Math.sin(t * 5), b = PLAY_BTN;
  ctx.save(); ctx.translate(180, b.y + b.h / 2); ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffd84a'; rrect(-b.w / 2, -b.h / 2, b.w, b.h, 14); ctx.fill();
  txt('TAP TO PLAY', 0, 1, 24, '#1a1f33');
  ctx.restore();
  txt('◀  drag to move  ▶', 180, 348, 12, '#c9d2e3', 'center', '600');
  SHOP.forEach((s, i) => {
    const r = shopBtn(i), lv = meta[s.key], cost = shopCost(s, meta), can = meta.coins >= cost;
    ctx.fillStyle = '#1b2138'; rrect(r.x, r.y, r.w, r.h, 10); ctx.fill();
    ctx.strokeStyle = can ? s.col : '#3a4260'; ctx.lineWidth = 2; rrect(r.x + 1, r.y + 1, r.w - 2, r.h - 2, 10); ctx.stroke();
    const cx = r.x + r.w / 2;
    txt(s.label[0], cx, r.y + (s.label[1] ? 16 : 24), 12, s.col);
    if (s.label[1]) txt(s.label[1], cx, r.y + 31, 12, s.col);
    txt('Lv ' + lv, cx, r.y + 50, 11, '#fff', 'center', '700');
    txt(s.eff(lv), cx, r.y + 65, 10, '#c9d2e3', 'center', '600');
    ctx.fillStyle = can ? '#ffd84a' : '#3a4260'; rrect(r.x + 8, r.y + 78, r.w - 16, 22, 11); ctx.fill();
    txt('● ' + cost, cx, r.y + 89, 12, can ? '#1a1f33' : '#8890a8', 'center');
  });
  txt(VERSION + '   ' + (saveOK ? 'SAVE ○' : 'SAVE ✕ (progress will not be kept)'), 10, 618, 10, saveOK ? '#667' : '#ff8a8a', 'left', 'normal');
  const rb = RESET_BTN, armed = resetArm > performance.now();
  ctx.fillStyle = armed ? '#7a2230' : 'rgba(255,255,255,0.08)'; ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
  ctx.strokeStyle = armed ? '#ff5a6a' : '#3a4260'; ctx.lineWidth = 1; ctx.strokeRect(rb.x + 0.5, rb.y + 0.5, rb.w - 1, rb.h - 1);
  txt(armed ? 'TAP AGAIN TO ERASE' : 'RESET SAVE', rb.x + rb.w / 2, rb.y + rb.h / 2 + 1, 9, armed ? '#fff' : '#8890a8', 'center', '600');
}

const LOSS_ROWS = [
  ['gate',  'RED GATES', 'Shoot red gates until they turn blue'],
  ['enemy', 'ENEMIES',   'Dodge into the thinner lane and shoot first'],
  ['tire',  'TIRES',     'Break tires before you reach them — or pick another lane'],
  ['boss',  'BOSS',      'Grow the army bigger than the boss number'],
];
function drawResult() {
  const r = resultInfo, C = CONFIG;
  drawRoad();
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, C.W, C.H);
  txt(r.cleared ? 'LEVEL ' + r.level + ' CLEAR!' : 'LEVEL ' + r.level + ' FAILED', 180, 96, 30, r.cleared ? '#fff36b' : '#ff5a6a');
  if (!r.cleared) {
    ctx.fillStyle = '#000a'; rrect(80, 126, 200, 10, 5); ctx.fill();
    ctx.fillStyle = '#ff8a5a'; rrect(80, 126, Math.max(10, 200 * r.prog), 10, 5); ctx.fill();
    txt(Math.floor(r.prog * 100) + '% of the way', 180, 150, 12, '#fff', 'center', '600');
  } else txt('army ' + r.left + ' left   (peak ' + r.peak + ')', 180, 140, 13, '#fff', 'center', '600');
  coinPill(130, 190, '+' + r.coins);
  txt('kills ' + r.kills + '    weapon ' + r.weapon, 180, 222, 12, '#c9d2e3', 'center', '600');
  txt('SOLDIERS LOST', 180, 262, 12, '#fff');
  const mx = Math.max(1, ...LOSS_ROWS.map(l => r.lost[l[0]]));
  let worst = LOSS_ROWS[0];
  LOSS_ROWS.forEach((l, i) => {
    const y = 290 + i * 28, v = r.lost[l[0]];
    if (v > r.lost[worst[0]]) worst = l;
    txt(l[1], 108, y, 11, '#c9d2e3', 'right', '700');
    ctx.fillStyle = '#000a'; ctx.fillRect(118, y - 6, 170, 12);
    ctx.fillStyle = '#ff5a6a'; ctx.fillRect(118, y - 6, 170 * v / mx, 12);
    txt(String(v), 296, y, 11, '#fff', 'left', '700');
  });
  if (!r.cleared) {
    txt('TIP', 180, 420, 11, '#fff36b');
    txt(worst[2], 180, 440, 12, '#fff', 'center', '600');
  }
  buttons = [];
  const go = { x: 60, y: 500, w: 240, h: 60, fn: () => { scene = 'menu'; } };
  ctx.fillStyle = '#ffd84a'; rrect(go.x, go.y, go.w, go.h, 14); ctx.fill();
  txt('CONTINUE', 180, go.y + 31, 24, '#1a1f33');
  buttons.push(go);
}

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#101320'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  let sx = 0, sy = 0;
  if (shakeT > 0) { shakeT -= dt; sx = (Math.random() - 0.5) * shakeA * 2; sy = (Math.random() - 0.5) * shakeA * 2; } else shakeA = 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx * scale), dpr * (offY + sy * scale));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, CONFIG.W, CONFIG.H); ctx.clip();

  if (scene === 'menu') { drawMenu(); drawFx(dt); }
  else if (scene === 'result') drawResult();
  else if (scene === 'play') {
    const g = game;
    if (!paused) {
      if (keys.ArrowLeft || keys.KeyA) g.target -= CONFIG.KEY_SPEED * dt;
      if (keys.ArrowRight || keys.KeyD) g.target += CONFIG.KEY_SPEED * dt;
      let gdt = dt;
      if (hitstop > 0) { hitstop -= dt; gdt = dt * 0.15; }
      update(g, gdt);
      bgY += CONFIG.SCROLL * gdt;
    }
    drawRoad(); drawRows(g, paused ? 0 : dt); drawWalls(g); drawEnemies(g); drawBullets(g); drawCrowd(g); drawFx(paused ? 0 : dt); drawHud(g);
    if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H); txt('PAUSED', 180, 300, 30, '#fff'); txt('tap to resume', 180, 340, 14, '#fff'); }
    if (g.over) {
      g.overT = (g.overT || 0) + dt;
      txt(g.over === 'clear' ? 'CLEAR!' : 'FAILED', 180, 300, 40, g.over === 'clear' ? '#fff36b' : '#ff5a6a');
      if (g.overT > 1.4) endRun();
    }
  }
  drawMute();
  ctx.restore();
  requestAnimationFrame(frame);
}
loadMeta();
requestAnimationFrame(frame);
</script>
