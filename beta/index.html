function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const R3 = { on: false };   
const rr = (a, b) => a + (b - a) * rng();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;


const SAVE_KEY = 'wars_meta_v24';
const OLD_KEYS = ['surinuke_meta'];   
let saveOK = false;
function defaultMeta() { return { coins: 0, level: 1, lvRate: 0, lvDmg: 0, lvIncome: 0, lvArmy: 0 }; }
let meta = defaultMeta();
function loadMeta() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) meta = Object.assign(defaultMeta(), JSON.parse(s));
    localStorage.setItem(SAVE_KEY + '_t', '1');
    saveOK = localStorage.getItem(SAVE_KEY + '_t') === '1';   
  } catch (e) { saveOK = false; }
}
function saveMeta() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) { saveOK = false; }
}

const RESET_BTN = { x: 250, y: 606, w: 102, h: 22 };
let resetArm = 0;
function resetMeta() {
  meta = defaultMeta();
  try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_KEY + '_t'); for (const k of OLD_KEYS) localStorage.removeItem(k), localStorage.removeItem(k + '_t'); } catch (e) { saveOK = false; }
  saveMeta();
}

const SHOP_V24 = [   
  { key: 'lvRate',   label: ['FIRE', 'RATE'],  col: '#6fc3ff', eff: lv => '+' + Math.round(CONFIG.UP_RATE * 100 * lv) + '%' },
  { key: 'lvDmg',    label: ['DAMAGE', ''],    col: '#ff8a5a', eff: lv => '+' + Math.round(CONFIG.UP_DMG * 100 * lv) + '%' },
  { key: 'lvIncome', label: ['INCOME', ''],    col: '#ffd84a', eff: lv => '+' + Math.round(CONFIG.UP_INCOME * 100 * lv) + '%' },
  { key: 'lvArmy',   label: ['+1', 'SOLDIER'], col: '#7dff9b', eff: lv => (CONFIG.START_UNITS + lv) + ' start' },
];

const SHOP = [SHOP_V24[1], SHOP_V24[0], SHOP_V24[3], SHOP_V24[2]];

function powerOf(m) { const C = CONFIG; return Math.round(10 * (1 + C.UP_DMG * m.lvDmg) * (1 + C.UP_RATE * m.lvRate) * (C.START_UNITS + m.lvArmy)); }

function recPower(level) { return Math.max(10, Math.round(7.5 * level * level / 5) * 5); }   
function shopCost(s, m) { return Math.round(CONFIG.COST_BASE * Math.pow(CONFIG.COST_GROW, m[s.key])); }


function newRun(level, m, seed) {
  rng = mulberry32(seed == null ? (Date.now() & 0xffffffff) : seed);
  const C = CONFIG;
  const g = {
    level, mul: Math.pow(C.LEVEL_GROW, level - 1), sc: 1 + C.GATE_GROW * (level - 1),
    t: 0, over: null,
    N: C.START_UNITS + m.lvArmy,   
    power: 1 + C.UP_DMG * m.lvDmg, rateMul: 1 + C.UP_RATE * m.lvRate, income: 1 + C.UP_INCOME * m.lvIncome,
    wlv: 0, lock: null,
    lx: 180, target: 180, units: [], cR: 10, cDepth: 10, shotAcc: [],
    bullets: [], enemies: [], rows: [], walls: [], boss: null,
    dist: 0, ti: 0, track: null, trackEnd: 1, chunk: 0, ramp: 1,
    coins: 0, coinAcc: 0, kills: 0, peak: 0,
    stats: { gate: 0, enemy: 0, tire: 0, boss: 0 },
    wGot: 0, wMiss: 0,   
  };
  g.peak = g.N;
  return g;
}



const SIZE = { 1: 11, 10: 17, 100: 26 };
function crowdItems(g) {
  const items = [];
  let n = Math.round(g.N);
  const tiers = n >= 300 ? [100, 10, 1] : n >= 120 ? [10, 1] : [1];
  for (const t of tiers) {
    const c = t === 1 ? n : Math.floor(n / t);
    for (let k = 0; k < c && items.length < 240; k++) items.push({ w: t, d: SIZE[t] });
    n -= c * t;
  }
  return items;
}

function formW(g) {
  const w = clamp(24 + 15 * Math.sqrt(Math.max(1, g.N)), 24, 150);   
  return g.lock != null ? Math.min(w, LANE_W - 12) : w;
}
function layoutCrowd(g, dt) {
  const C = CONFIG, items = crowdItems(g), rowW = formW(g);
  const rows = []; let row = [], x = 0, y = C.LEADER_Y, h = 0;
  for (const it of items) {
    if (x + it.d > rowW && row.length) { rows.push({ row, w: x, y, h }); y += h; row = []; x = 0; h = 0; }
    it.ox = x + it.d / 2; x += it.d; h = Math.max(h, it.d); row.push(it);
  }
  if (row.length) rows.push({ row, w: x, y, h });
  const old = g.units, k = Math.min(1, dt * 20);
  let i = 0;
  for (const r of rows) for (const it of r.row) {
    const o = old[i++];
    const tx = clamp(g.lx - r.w / 2 + it.ox, C.ROAD_L + 3, C.ROAD_R - 3), ty = r.y + r.h / 2;
    it.x = o ? o.x : g.lx; it.y = o ? o.y : C.LEADER_Y + 20;
    it.x += (tx - it.x) * k; it.y += (ty - it.y) * k;
  }
  g.units = items;
  g.cR = rowW / 2; g.cDepth = rows.length ? y + h - C.LEADER_Y : 8;
}
function loseUnits(g, n, why, x, y) {
  n = Math.min(g.N, Math.max(0, Math.round(n)));
  if (n <= 0) return;
  g.N -= n; g.stats[why] += n;
  if (!SIM) { popText(x, y, '−' + n, '#ff5a6a', 18); sfx('lose'); shake(3); }
  if (g.N <= 0) { g.over = 'fail'; if (!SIM) sfx('fail'); }
}

function addCoins(g, base, x, y) {
  g.coinAcc += base * g.income;
  const v = Math.floor(g.coinAcc);
  if (v <= 0) return;
  g.coinAcc -= v; g.coins += v;
  if (!SIM) coinFx(x, y, v);
}


const LANE_W = (CONFIG.ROAD_R - CONFIG.ROAD_L) / 3;
function laneOf(x) { return clamp(Math.floor((x - CONFIG.ROAD_L) / LANE_W), 0, 2); }
function laneX(i) { return CONFIG.ROAD_L + LANE_W * (i + 0.5); }

function slotBlue(g, big, noMul) {
  
  if (!noMul && rng() < CONFIG.MUL_RATE) return { type: 'mul', v: 2, good: true, hitT: 0 };
  const k = Math.round(rr(CONFIG.BLUE_MIN, CONFIG.BLUE_MAX) * g.sc * (big || 1));
  return { type: 'add', v: k, good: true, hitT: 0 };
}
function slotRed(g, big) {
  if (rng() < 0.1) return { type: 'div', v: 2, charge: 0, need: CONFIG.DIV_NEED, good: false, hitT: 0 };
  const k = Math.max(3, Math.round(rr(CONFIG.RED_MIN, CONFIG.RED_MAX) * g.sc * g.ramp * (big || 1)));
  return { type: 'add', v: -k, good: false, hitT: 0 };
}


function slotTire(g, m) { const hp = Math.round((CONFIG.TIRE_BASE + CONFIG.TIRE_HP * g.chunk) * Math.pow(recPower(g.level) / 10, CONFIG.TIRE_POW) * (m || 1)) * CONFIG.TIRE_SHOW; return { type: 'tire', hp, max: hp, hitT: 0, coinAcc: 0 }; }

const WEAPONS = [
  { name: 'GUN',     rate: 1.00, dmg: 1.00, color: '#e8f4ff' },
  { name: 'RIFLE',   rate: 1.25, dmg: 1.35, color: '#7fe0ff' },
  { name: 'BLASTER', rate: 1.50, dmg: 1.75, color: '#c98bff' },
  { name: 'LASER',   rate: 1.80, dmg: 2.20, color: '#ff8adf' },
];

function weapon(g) {
  const w = WEAPONS[Math.min(WEAPONS.length - 1, g.wlv)], k = CONFIG.WEAPON_POW;
  return { name: w.name, color: w.color, rate: Math.pow(w.rate, k), dmg: Math.pow(w.dmg, k) };
}

function slotWeaponTire(g) {
  if (!CONFIG.WEAPON_TIRES) return slotTire(g);   
  const hp = Math.round(CONFIG.WEAPON_HP * g.mul * (g.wk === 0 ? CONFIG.WEAPON_FIRST : 1 + 0.5 * (g.wk - 1))) * CONFIG.TIRE_SHOW;   
  g.wk++;
  return { type: 'tire', hp, max: hp, hitT: 0, coinAcc: 0, weapon: true };
}

function hpText(sl) {
  sl.disp = sl.disp == null ? sl.hp : sl.disp + (sl.hp - sl.disp) * 0.35;
  return Math.max(0, Math.ceil(sl.disp)).toLocaleString('en-US');
}
const tireDmg = d => d * CONFIG.TIRE_SHOW * CONFIG.TIRE_BRITTLE;   

function rowSegs(row, t) {
  const L = CONFIG.ROAD_L, R = CONFIG.ROAD_R, f = row.free;
  if (f) {
    const xs = [L];
    for (const c of f.cuts) xs.push(c.x + c.amp * Math.sin(t * c.f + c.ph) + c.sg * (c.w / 2 + c.wa * Math.sin(t * c.f * 1.3 + c.ph)));
    xs.push(R);
    for (let i = 1; i < xs.length - 1; i++) xs[i] = clamp(xs[i], xs[i - 1] + 24, R - 24 * (xs.length - 1 - i));
    return f.parts.map((s, i) => ({ x0: xs[i], x1: xs[i + 1], s }));
  }
  if (row.lanes[0].wide) return [{ x0: L, x1: R, s: row.lanes[0] }];
  return [0, 1, 2].map(i => ({ x0: L + LANE_W * i, x1: L + LANE_W * (i + 1), s: row.lanes[i] }));
}
function segAt(row, x) { for (const z of row.segs) if (x < z.x1) return z; return row.segs[row.segs.length - 1]; }
function rowSlots(row) { return [...new Set(row.segs.map(z => z.s))]; }
function shuffle3(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }



const STAGES = [
  { name: 'FIRST STEPS',  lane: 0.20, wall: 0.10, wide: 0.15, tire: 0.20, move: 0.3, scene: 'bridge' },   
  { name: 'MOVING GATES', lane: 0.10, wall: 0.05, wide: 0.10, tire: 0.10, move: 1.0, scene: 'city' },
  { name: 'POWER LANE',   lane: 0.75, wall: 0.00, wide: 0.10, tire: 0.20, move: 0.5, scene: 'bridge' },
  { name: 'BLACK WALLS',  lane: 0.10, wall: 0.60, wide: 0.10, tire: 0.20, move: 0.5, scene: 'city' },
  { name: 'THE HORDE',    lane: 0.15, wall: 0.10, wide: 0.45, tire: 0.10, move: 0.5, scene: 'city' },
  { name: 'TIRE FIELD',   lane: 0.10, wall: 0.10, wide: 0.10, tire: 0.45, move: 0.5, scene: 'bridge' },
];
function stageOf(level) { return STAGES[(level - 1) % STAGES.length]; }

function freeRow(g, c) {
  const C = CONFIG, L = C.ROAD_L, R = C.ROAD_R, r = rng();
  const move = c >= 2 && rng() < stageOf(g.level).move;
  const cut = (x, sg, w, wa, amp, f, ph) => ({ x, sg, w, wa, amp, f, ph });
  const one = x => cut(x, 0, 0, 0, move ? rr(30, 70) : 0, rr(0.6, 1.3), rr(0, 6.28));
  const win = (parts, w) => {   
    const cx = rr(L + w / 2 + 20, R - w / 2 - 20), amp = move ? rr(40, 90) : 0, wa = move && rng() < 0.4 ? rr(15, 30) : 0, f = rr(0.8, 1.6), ph = rr(0, 6.28);
    return { parts, cuts: [cut(cx, -1, w, wa, amp, f, ph), cut(cx, 1, w, wa, amp, f, ph)] };
  };
  if (c < 2) return win([slotRed(g), slotBlue(g, 1, true), slotRed(g)], 120);
  if (r < 0.22) return win([slotRed(g, 1.2), slotBlue(g, 1, true), slotRed(g, 1.2)], rr(50, 100));
  if (r < 0.34) return win([slotRed(g, 1.2), { type: 'mul', v: 2, good: true, hitT: 0 }, slotRed(g, 1.2)], rr(36, 60));
  if (r < 0.56) {
    const pair = rng() < 0.5 ? [slotRed(g, 0.6), slotRed(g, 1.3)] : [slotBlue(g, 0.8, true), slotRed(g, 1.4)];
    return { parts: rng() < 0.5 ? pair : pair.reverse(), cuts: [one(rr(110, 250))] };
  }
  if (r < 0.8) {
    const x1 = rr(70, 200), x2 = rr(x1 + 50, 300);
    return { parts: shuffle3([slotRed(g), slotRed(g, 1.3), slotBlue(g, 0.9, true)]), cuts: [one(x1), one(x2)] };
  }
  
  const side = rng() < 0.5, bl = slotBlue(g, 0.6, true), sr = slotRed(g, 0.5);
  return win([side ? bl : sr, slotRed(g, 1.5), side ? sr : bl], rr(60, 110));
}
function buildTrack(g) {
  const C = CONFIG, G = C.TRACK_GAP, T = [];
  let d = 0, theme = null, left = 0, up = 0, k = 0;
  const S = stageOf(g.level);
  g.wk = 0;
  
  const chunks = C.CHUNKS + Math.min(4, Math.floor((g.level - 1) / 3));
  for (let c = 0; c < chunks; c++) {
    
    g.ramp = Math.min(1, 0.4 + 0.15 * c); g.chunk = c;
    
    
    const G = C.TRACK_GAP * rr(0.75, 1.35);
    
    const rows = c < 2 ? 1 : 1 + Math.floor(c / 3) + Math.min(6, Math.floor((g.level - 1) / C.ROW_EVERY));
    const cols = c < 2 ? c + 1 : Math.min(6, 1 + c + Math.floor(g.level / 3));
    if (left <= 0) {   
      const t = rng();
      theme = c < 2 ? 'open' : t < S.lane ? 'lane' : t < S.lane + S.wall ? 'wall' : 'open';
      if (theme === 'wall' && c >= chunks - 1) theme = 'open';
      left = c < 2 ? 2 : theme === 'lane' ? 3 : theme === 'wall' ? 1 : 2;
      up = rng() < 0.5 ? 0 : 2; k = 0;
    }
    left--;
    const r = rng();
    if (theme === 'lane') {
      
      const mon = [0, 1, 2].filter(i => i !== up);
      T.push({ dist: d += G * C.SQUAD_AFTER, kind: 'squad', lanes: mon, rows: rows + C.MON_ROWS, cols: 5, brute: g.level >= 3 && k === 1 });
      const upSlot = k % 3 === 0 ? (CONFIG.WEAPON_TIRES ? slotWeaponTire(g) : slotBlue(g, 0.8, true)) : k % 3 === 1 ? slotBlue(g, 0.7, true) : slotRed(g, 0.6);
      const big = rng() < 0.5 ? 0 : 1;
      const lanes = [];
      lanes[up] = upSlot; lanes[mon[big]] = slotBlue(g, C.MON_BLUE); lanes[mon[1 - big]] = slotRed(g);
      T.push({ dist: d += G * 0.9, kind: 'row', lanes });
      k++;
      continue;
    }
    if (theme === 'wall') {
      
      T.push({ dist: d += G * C.SQUAD_AFTER, kind: 'squad', lanes: [ri(0, 2)], rows, cols });
      const plans = shuffle3([
        [slotBlue(g, 0.8), 'squad'],
        [slotRed(g, 1.3), { type: 'mul', v: 2, good: true, hitT: 0 }],
        [slotWeaponTire(g), slotBlue(g)],
      ]);
      const w0 = d + G * 0.9, len = 60 + G + 150;
      T.push({ dist: w0, kind: 'wall', len });
      T.push({ dist: w0 + 60, kind: 'row', lanes: plans.map(p => p[0]) });
      const second = plans.map(p => p[1] === 'squad' ? { type: 'empty' } : p[1]);
      T.push({ dist: w0 + 60 + G * 0.55, kind: 'squad', lanes: plans.map((p, i) => p[1] === 'squad' ? i : -1).filter(i => i >= 0), rows: rows + 1, cols: 5 });
      T.push({ dist: w0 + 60 + G, kind: 'row', lanes: second });
      d = w0 + len;
      continue;
    }
    
    if (c >= 2 && r < S.wide) {
      
      T.push({ dist: d += G * C.SQUAD_AFTER, kind: 'squad', lanes: [0, 1, 2], rows, cols: 4, brute: g.level >= 3 && rng() < 0.4 });   
      const w = slotRed(g, CONFIG.WIDE_RED); w.wide = true;   
      T.push({ dist: d += 170, kind: 'row', lanes: [w, w, w] });
      continue;
    }
    T.push({ dist: d += (c === 0 ? 80 : G * C.SQUAD_AFTER), kind: 'squad', lanes: [ri(0, 2)], rows, cols, soft: c < 2 });
    if (c >= 2 && r < S.wide + S.tire) {
      
      const open = ri(0, 2), wl = (open + ri(1, 2)) % 3;
      T.push({ dist: d += G, kind: 'row', lanes: [0, 1, 2].map(i => i === open ? { type: 'empty' } : i === wl ? slotWeaponTire(g) : slotTire(g)) });
      T.push({ dist: d + 40, kind: 'squad', lanes: [open], rows: rows + 1, cols: 5 });
      continue;
    }
    
    T.push({ dist: d += G, kind: 'row', free: freeRow(g, c) });
  }
  g.ramp = 1; g.chunk = chunks;
  
  for (let r = 0; r < 3; r++) T.push({ dist: d += G * 0.7, kind: 'row', lanes: [0, 1, 2].map(() => slotTire(g, 0.25 + 0.1 * r)) });
  T.push({ dist: d += G, kind: 'boss' });
  return T;
}

function spawnSquad(g, lane, rows, cols, brute, soft) {
  const C = CONFIG, em = g.mul * (soft ? 0.5 : 1), x0 = laneX(lane) - LANE_W * 0.4;
  cols = cols || 6;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    g.enemies.push({ kind: 'grunt', lane, x: x0 + (c + 0.5) * (LANE_W * 0.8 / cols) + rr(-2, 2), y: -30 - r * 19, r: 9,
      hp: C.GRUNT_HP * em, max: C.GRUNT_HP * em, vy: C.ENEMY_VY + rr(-3, 3), bite: 1,
      hk: rr(0.6, 1.2), wob: rr(0.5, 2.5), wf: rr(1.2, 3), ph: rr(0, 6.28) });
  if (brute) g.enemies.push({ kind: 'brute', lane, x: laneX(lane), y: -44 - rows * 19, r: 19, hp: C.BRUTE_HP * em, max: C.BRUTE_HP * em, vy: C.ENEMY_VY, bite: 6, hk: 0.5 });
}
function trackFlow(g, dt, scroll) {
  if (!g.track) { g.track = buildTrack(g); g.trackEnd = g.track[g.track.length - 1].dist; }
  if (!g.boss) g.dist += scroll * dt;
  while (g.ti < g.track.length && g.dist >= g.track[g.ti].dist) {
    const sp = g.track[g.ti++];
    if (sp.kind === 'row') { const row = { y: -40, lanes: sp.lanes || [], free: sp.free, done: false }; row.segs = rowSegs(row, g.t); g.rows.push(row); }
    else if (sp.kind === 'wall') g.walls.push({ y: -40, len: sp.len, lane: null });
    else if (sp.kind === 'squad') sp.lanes.forEach((l, k) => spawnSquad(g, l, sp.rows, sp.cols, sp.brute && k === 1, sp.soft));
    else if (sp.kind === 'boss') spawnBoss(g);   
  }
}
function spawnBoss(g) {
  g.boss = { x: 180, y: -60, r: 46, hp: CONFIG.BOSS_HP * g.mul, max: CONFIG.BOSS_HP * g.mul, t: 0, flash: 0 };
  if (!SIM) { sfx('boss'); shake(6); }
}


function gateLabel(sd) {
  if (sd.type === 'add') { const v = Math.round(sd.v); return v >= 0 ? '+' + v : '−' + (-v); }
  if (sd.type === 'mul') return '×' + sd.v;
  return '÷' + sd.v;
}

function shootGate(g, sd, x, y) {
  sd.hitT = 0.08;

function update(g, dt) {

  for (const w of g.walls) w.y += scroll * dt;

  const half = formW(g) / 2;

  for (const row of g.rows) {

    }

  const R = g.cR;

function hurt(g, e, d) {

  if (e === g.boss) {
    if (e.y < 0) return;   
    e.hp -= d; e.flash = 0.06;

  if (!SIM) { burst(e.x, e.y, '#ffffff', e.kind === 'brute' ? 14 : 5); burst(e.x, e.y, e.kind === 'brute' ? '#ff7a1a' : '#ffb347', e.kind === 'brute' ? 16 : 5);

}


let SIM = false;

function projVal(g, sl, t, shots, dps) {
  const C = CONFIG, tr = Math.min(t, C.RANGE / C.SCROLL), grow = Math.min(C.GATE_PER_SEC, shots) * tr * 0.6;

  }

  const W = weapon(g), shots = g.units.length * C.SHOT_RATE * g.rateMul * W.rate, dps = g.N * g.power * g.rateMul * W.rate * W.dmg;
  const w = g.walls.find(w => w.lane == null && w.y < C.LEADER_Y && w.y > C.LEADER_Y - 420);
  const rows = g.rows.filter(r => !r.done && r.y < C.LEADER_Y && (w ? r.y >= w.y - w.len - 5 : true)).sort((a, b) => b.y - a.y).slice(0, w ? 3 : 1);
  
  const fw = formW(g), cands = [0, 1, 2].map(laneX);

  let best = g.lx, bestV = -1e9;

    let hp = 0, near = 1e9;
    for (const e of g.enemies) if (e.y < C.LEADER_Y && e.y > -40 && Math.abs(e.x - x) < fw / 2 + 8) { hp += e.hp; near = Math.min(near, (C.LEADER_Y - e.y) / (C.SCROLL + C.ENEMY_VY)); }
    if (hp > 0) { const left = hp - dps * Math.min(near, C.RANGE / (C.SCROLL + C.ENEMY_VY)) * 0.8; v += left > 0 ? -1.5 * left / (C.GRUNT_HP * g.mul) : 6; }

           brk: g.brk ? +(g.brk.reduce((a, b) => a + b, 0) / g.brk.length).toFixed(2) : null, wGot: g.wGot, wMiss: g.wMiss, prog: +Math.min(1, g.dist / g.trackEnd).toFixed(2), bossHp: g.boss ? Math.round(g.boss.hp) : null };

function withCfg(cfg, fn) {

};

function autoBuy(m) {

let parts = [], texts = [], rings = [], shakeT = 0, shakeA = 0, hitstop = 0, coinsFly = [], weaponBanner = null;

let audio = null, muted = false, lastShot = 0;
function initAudio() {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
  if (audio) {
    try { const b = audio.createBuffer(1, 1, audio.sampleRate), s = audio.createBufferSource(); s.buffer = b; s.connect(audio.destination); s.start(0); } catch (e) {}
    audio.resume();
  }
}
function tone(f, dur, type, vol, slide) {
  if (!audio || muted) return;
  const t0 = audio.currentTime, o = audio.createOscillator(), gn = audio.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  gn.gain.setValueAtTime(0, t0);
  gn.gain.linearRampToValueAtTime(CONFIG.VOLUME * (vol == null ? 1 : vol), t0 + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}

function sfx(k) {

  const now = performance.now();
  switch (k) {
    case 'shot': if (now - lastShot < 90) return; lastShot = now; tone(180, 0.035, 'sine', 0.08, 120); break;
    case 'kill': tone(160 + Math.random() * 50, 0.07, 'triangle', 0.22, 70); break;
    case 'gate': tone(330, 0.09, 'triangle', 0.45); setTimeout(() => tone(440, 0.11, 'triangle', 0.45), 60); break;
    case 'bad': tone(110, 0.28, 'triangle', 0.5, 60); break;
    case 'lose': tone(90, 0.09, 'triangle', 0.3); break;
    case 'combo': [262, 330, 392, 523].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.4), i * 70)); break;
    case 'boss': tone(55, 0.8, 'sawtooth', 0.35, 40); break;
    case 'clear': [262, 330, 392, 523, 392, 523].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.5), i * 110)); break;
    case 'fail': tone(150, 0.6, 'triangle', 0.45, 55); break;
    case 'flip': [262, 392, 523].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'triangle', 0.4), i * 50)); break;
    case 'warn': tone(440, 0.12, 'triangle', 0.3); setTimeout(() => tone(440, 0.12, 'triangle', 0.3), 180); break;
    case 'buy': tone(440, 0.07, 'triangle', 0.4); setTimeout(() => tone(660, 0.1, 'triangle', 0.4), 60); break;
    case 'no': tone(100, 0.1, 'triangle', 0.3); break;

}

const LOOK3 = 900;   
function ahead3D(g) {
  const out = { rows: [], walls: [], squads: [], boss: null };
  if (!g.track) return out;
  for (let i = g.ti; i < g.track.length; i++) {
    const sp = g.track[i], ahead = sp.dist - g.dist;
    if (ahead > LOOK3) break;
    if (sp.kind === 'row') { const r = sp._row || (sp._row = { lanes: sp.lanes || [], free: sp.free, done: false }); r.segs = rowSegs(r, g.t); r.y = -40 - ahead; out.rows.push(r); }
    else if (sp.kind === 'wall') out.walls.push({ y: -40 - ahead, len: sp.len });
    else if (sp.kind === 'squad') out.squads.push({ sp, ahead });
    else if (sp.kind === 'boss') out.boss = { y: -60 - ahead };
  }
  return out;
}

    R3.idle = newRun(meta.level, meta, 1); R3.idleKey = key;
    rng = keep;   
    layoutCrowd(R3.idle, 1);
  }
  return R3.idle;
}
function render3D(g, sx, sy) {
  const R = R3, T = R.T, d = R.dummy, C = CONFIG;
  
  R.camX = (R.camX || 0) + (wx(g.lx) * 0.3 - (R.camX || 0)) * 0.08;
  R.cam.position.set(R.camX + sx * 0.05, CAM3.y + sy * 0.05, CAM3.z); R.cam.lookAt(R.camX * 0.6 + sx * 0.05, 0, CAM3.look);
  R.tex.offset.y = (bgY / U3) / 4;   
  for (let i = 0; i < 40; i++) {   
    const z = -168 + ((i >> 1) * 9 + (bgY / U3) % 9);
    d.position.set((i & 1 ? 1 : -1) * ((C.ROAD_R - C.ROAD_L) / U3 / 2 + 2.7), 1.7, z); d.scale.set(1, 1, 1); d.rotation.set(0, 0, 0); d.updateMatrix();
    R.postIM.setMatrixAt(i, d.matrix);
  }
  R.postIM.instanceMatrix.needsUpdate = true;
  
  const onBridge = stageOf(g.level).scene === 'bridge';
  R.bridgeSet.visible = onBridge; R.citySet.visible = !onBridge;
  if (onBridge) {
    for (let i = 0; i < 110; i++) {   
      const z = -118 + ((i >> 1) * 2.4 + (bgY / U3) % 2.4);
      d.position.set((i & 1 ? 1 : -1) * ((C.ROAD_R - C.ROAD_L) / U3 / 2 + 0.15), 0.45, z); d.scale.set(1, 1, 1); d.rotation.set(0, 0, 0); d.updateMatrix();
      R.railPostIM.setMatrixAt(i, d.matrix);
    }
    R.railPostIM.instanceMatrix.needsUpdate = true;
    const run2 = bgY / U3;
    R.towers.forEach((t, i) => { t.position.z = -150 + ((i * 36 + run2) % 180); });
    R.islands.forEach(o => { o.position.set(o.userData.x, 0, -150 + ((o.userData.z0 + 150 + run2 * 0.6) % 170 + 170) % 170); });
  }
  
  const run = bgY / U3;
  R.lots.forEach(o => { o.position.set(o.userData.x, 0, -164 + ((o.userData.z0 + run) % 176)); });
  for (const fl of R.flames) { const k = 1 + 0.15 * Math.sin(g.t * 11 + fl.ph) + 0.08 * Math.sin(g.t * 23 + fl.ph); fl.f.scale.set(1, k, 1); fl.c.scale.set(1, 2 - k, 1); }
  R.clouds.forEach(o => { o.position.set(o.userData.x, o.userData.y, -150 + ((o.userData.z0 + 150 + run * 0.15) % 140 + 140) % 140); });
  
  const AH = R.ah = ahead3D(g);
  for (const row of g.rows.concat(AH.rows)) {
    const z = wz(row.y);
    if (z < -100 || z > 14) continue;
    for (const s of row.segs) {
      const sl = s.s, x0 = wx(s.x0), x1 = wx(s.x1), cx = (x0 + x1) / 2, w = x1 - x0;
      if (sl.type === 'empty') continue;
      if (sl.type === 'tire') {
        if (sl.hp <= 0) continue;
        const t = R.tires.get(), r = Math.min(w * 0.42, 2.2), u = t.userData, hit = sl.hitT > 0 ? 1.06 : 1;
        if (sl.skin == null) sl.skin = Math.floor(Math.random() * 3);   
        u.tire.visible = sl.skin === 0; u.tree.visible = sl.skin === 1; u.car.visible = sl.skin === 2;
        u.fl.scale.set(1, 0.8 + 0.3 * Math.abs(Math.sin(g.t * 11 + cx)), 1);
        t.position.set(cx, 0, z); t.scale.set(r * hit, hit, r * hit);
        for (let k = 0; k < 3; k++) u.tire.children[k].material.color.setHex(sl.hitT > 0 ? 0x5a5f70 : 0x1c1f28);
        continue;
      }
      const taken = row.done && !(row.picked || []).includes(sl), H = 2.3;
      const pn = R.panels.get(); pn.material = taken ? R.matDim : sl.good ? R.matBlue : R.matRed;
      pn.position.set(cx, H / 2, z); pn.scale.set(Math.max(0.05, w - 0.12), H, 0.08);
      const fm = sl.good ? R.matBlueF : R.matRedF;
      for (const [px, pw] of [[x0 + 0.08, 0.16], [x1 - 0.08, 0.16]]) { const f = R.frames.get(); f.material = taken ? R.matDim : fm; f.position.set(px, H / 2, z); f.scale.set(pw, H, 0.16); }
      const top = R.frames.get(); top.material = taken ? R.matDim : fm; top.position.set(cx, H, z); top.scale.set(w, 0.16, 0.16);
    }
  }
  R.panels.end(); R.frames.end(); R.tires.end();
  
  for (const w of g.walls.concat(AH.walls)) for (const bx of [C.ROAD_L + LANE_W, C.ROAD_L + LANE_W * 2]) {
    const m = R.walls.get(), z0 = wz(w.y - w.len), z1 = wz(w.y);
    m.position.set(wx(bx), 0.8, (z0 + z1) / 2); m.scale.set(0.45, 1.6, z1 - z0);
  }
  R.walls.end();
  
  let n = 0;
  for (const u of g.units) {
    if (n >= 260) break;
    const k = u.d / 11;
    d.rotation.set(0, 0, 0);
    d.position.set(wx(u.x), 0.3 * k, wz(u.y)); d.scale.set(k, k, k); d.updateMatrix(); R.unitBody.setMatrixAt(n, d.matrix);
    d.position.y = 0.72 * k; d.updateMatrix(); R.unitHead.setMatrixAt(n, d.matrix);
    d.position.y = 0.66 * k; d.updateMatrix(); R.unitBrim.setMatrixAt(n, d.matrix);
    d.position.y = 0.925 * k; d.updateMatrix(); R.unitStripe.setMatrixAt(n, d.matrix);
    d.position.set(wx(u.x), 0.38 * k, wz(u.y) + 0.24 * k); d.updateMatrix(); R.unitTank.setMatrixAt(n, d.matrix);
    n++;
  }
  R.unitBody.count = R.unitHead.count = R.unitBrim.count = R.unitStripe.count = R.unitTank.count = n;
  for (const im of [R.unitBody, R.unitHead, R.unitBrim, R.unitStripe, R.unitTank]) im.instanceMatrix.needsUpdate = true;
  
  n = 0; let h = 0;
  const flame = (x, y, r, col, ph) => {
    if (n >= 500) return;
    const fl = 1 + 0.16 * Math.sin(g.t * 13 + ph) + 0.1 * Math.sin(g.t * 23 + ph * 1.7), sw = Math.sin(g.t * 7 + ph) * 0.14 + Math.sin(g.t * 17 + ph) * 0.06;   
    d.rotation.set(0, 0, sw); d.position.set(wx(x), r * 1.1 * fl, wz(y)); d.scale.set(r, r * fl, r); d.updateMatrix(); R.enemyBody.setMatrixAt(n, d.matrix);
    R.col.setHex(col); R.enemyBody.setColorAt(n, R.col);
    d.position.set(wx(x), r * 0.8 * fl, wz(y) + r * 0.15); d.updateMatrix(); R.enemyHorn.setMatrixAt(n, d.matrix);
    d.rotation.set(0, 0, 0); d.scale.set(r, r, r);
    for (const sgn of [-1, 1]) { if (h >= 1000) break; d.position.set(wx(x) + sgn * r * 0.3, r * 0.75, wz(y) + r * 0.7); d.updateMatrix(); R.enemyEye.setMatrixAt(h++, d.matrix); }
    d.rotation.set(-Math.PI / 2, 0, 0); d.position.set(wx(x), 0.03, wz(y)); d.scale.set(r * 2.6 * fl, r * 2.6 * fl, 1); d.updateMatrix(); R.glowIM.setMatrixAt(n, d.matrix);   
    n++;
  };
  for (const e of g.enemies) flame(e.x, e.y, e.r / U3 * 1.1, e.kind === 'brute' ? 0xff3b1a : 0xff7a1a, e.x * 0.37);
  
  for (const { sp, ahead } of AH.squads) for (const lane of sp.lanes) {
    const cols = sp.cols || 6, x0 = laneX(lane) - LANE_W * 0.4;
    for (let rI = 0; rI < sp.rows; rI++) for (let c = 0; c < cols; c++) flame(x0 + (c + 0.5) * (LANE_W * 0.8 / cols), -30 - rI * 19 - ahead, 9 / U3 * 1.1, 0xff7a1a, c + rI);
  }
  R.enemyBody.count = R.enemyHorn.count = R.glowIM.count = n; R.enemyEye.count = h;
  R.enemyBody.instanceMatrix.needsUpdate = R.enemyHorn.instanceMatrix.needsUpdate = R.enemyEye.instanceMatrix.needsUpdate = R.glowIM.instanceMatrix.needsUpdate = true;
  if (R.enemyBody.instanceColor) R.enemyBody.instanceColor.needsUpdate = true;
  
  n = 0;
  
  const bs = Math.min(2, 1 + (g.power - 1) * 0.45) * 0.7;
  R.bulletIM.material.color.setHSL(0.56, 1, Math.max(0.5, 0.82 - (g.power - 1) * 0.1));
  for (const b of g.bullets) {
    if (n >= 700) break;
    const k = Math.min(2.2, bs * (1 + Math.log10(b.w || 1) * 0.4));
    d.rotation.set(0, 0, 0); d.position.set(wx(b.x), 0.55, wz(b.y)); d.scale.set(k, k, k * 1.8); d.updateMatrix(); R.bulletIM.setMatrixAt(n++, d.matrix);
  }
  R.bulletIM.count = n; R.bulletIM.instanceMatrix.needsUpdate = true;
  
  const Bs = g.boss || (AH.boss && { x: 180, y: AH.boss.y, r: 46, hp: 1, flash: 0 });   
  R.boss.visible = !!(Bs && Bs.hp > 0);
  if (R.boss.visible) {
    const r = Bs.r / U3;
    R.boss.position.set(wx(Bs.x), r * 1.05, wz(Bs.y)); R.boss.scale.set(r, r, r); R.boss.rotation.y = Math.sin(g.t * 1.5) * 0.3;
    R.bossBody.material.color.setHex(Bs.flash > 0 ? 0xffffff : 0xff5a1a);
    const fk = 1 + 0.06 * Math.sin(g.t * 13); R.boss.scale.set(r * fk, r * (2 - fk), r * fk);   
  }
  R.renderer.render(R.scene3, R.cam);
}

function drawLabels3D(g) {
  for (const row of g.rows.concat(R3.ah ? R3.ah.rows : [])) {
    if (row.y < -40 - LOOK3 * 0.6 || row.y > CONFIG.H + 20) continue;   
    for (const s of row.segs) {
      const sl = s.s, cx = (s.x0 + s.x1) / 2;
      if (sl.type === 'empty') continue;
      if (sl.type === 'tire') {
        if (sl.hp <= 0) continue;
        const [px, py, k] = P3(cx, row.y, 2.2);
        txt(hpText(sl), px, py - 8 * k, (sl.hitT > 0 ? 21 : 18) * k, '#ff9a5a');
        continue;
      }
      if (row.done) continue;
      const [px, py, k] = P3(cx, row.y, 1.15), [ax] = P3(s.x0, row.y, 1.15), [bx] = P3(s.x1, row.y, 1.15);
      const fs = clamp((bx - ax) * 0.42, 9, 24 * k);
      if (sl.type === 'div') { txt('÷2', px, py, fs, '#fff'); continue; }
      txt(gateLabel(sl), px, py, sl.hitT > 0 ? fs * 1.12 : fs, '#fff');
    }
  }
  const Bs = g.boss;
  if (Bs && Bs.hp > 0) { const [px, py, k] = P3(Bs.x, Bs.y, Bs.r / U3 * 2.6); txt(String(Math.max(0, Math.ceil(Bs.hp / CONFIG.CLASH))), px, py, 24 * k, '#fff'); }
  const [px, py] = P3(g.lx, CONFIG.LEADER_Y, 1.6);
  txt(String(g.N), px, py, 20, '#fff');
}

let last = performance.now();
function frame(now) {
  let dt = clamp((now - last) / 1000, 0, 0.05); last = now;   
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const in3D = R3.on;   
  document.getElementById('gl').style.display = in3D ? 'block' : 'none';
  if (in3D) ctx.clearRect(0, 0, canvas.width, canvas.height);
  else { ctx.fillStyle = '#101320'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  let sx = 0, sy = 0;
  if (shakeT > 0) { shakeT -= dt; sx = (Math.random() - 0.5) * shakeA * 2; sy = (Math.random() - 0.5) * shakeA * 2; } else shakeA = 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx * scale), dpr * (offY + sy * scale));
  ctx.save(); ctx.beginPath(); if (in3D) ctx.rect(VB.l, VB.t, VB.r - VB.l, VB.b - VB.t); else ctx.rect(0, 0, CONFIG.W, CONFIG.H); ctx.clip();

  if (in3D && scene !== 'play') { const ig = idleGame(); ig.t += dt; bgY += 20 * dt; render3D(ig, 0, 0); }
  if (scene === 'menu') { drawMenu(); drawFx(dt); }
  else if (scene === 'result') drawResult();
  else if (scene === 'play') {
    const g = game;
    if (!paused) {
      if (keys.ArrowLeft || keys.KeyA) g.target -= CONFIG.KEY_SPEED * dt;
      if (keys.ArrowRight || keys.KeyD) g.target += CONFIG.KEY_SPEED * dt;
      let gdt = dt;
      if (hitstop > 0) { hitstop -= dt; gdt = dt * 0.15; }
      update(g, gdt);
      bgY += CONFIG.SCROLL * gdt;
    }
    if (in3D) { render3D(g, sx, sy); drawLabels3D(g); }
    else { drawRoad(); drawRows(g, paused ? 0 : dt); drawWalls(g); drawEnemies(g); drawBullets(g); drawCrowd(g); }
    drawFx(paused ? 0 : dt); drawHud(g);
    if (introT > 0) {   
      introT -= dt; ctx.globalAlpha = Math.min(1, introT / 0.4);
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(VB.l, 230, VB.r - VB.l, 80);
      txt('LEVEL ' + g.level, 180, 252, 16, '#fff'); txt(stageOf(g.level).name, 180, 284, 28, '#ffd84a');
      ctx.globalAlpha = 1;
    }
    if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(VB.l, VB.t, VB.r - VB.l, VB.b - VB.t); txt('PAUSED', 180, 300, 30, '#fff'); txt('tap to resume', 180, 340, 14, '#fff'); }
    if (g.over) {
      g.overT = (g.overT || 0) + dt;
      txt(g.over === 'clear' ? 'CLEAR!' : 'FAILED', 180, 300, 40, g.over === 'clear' ? '#fff36b' : '#ff5a6a');
      if (g.overT > 1.4) endRun();
    }
  }
  drawMute();
  ctx.restore();
  requestAnimationFrame(frame);
}
loadMeta();
init3D();   
requestAnimationFrame(frame);
</script>
