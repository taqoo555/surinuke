function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const SIZE = { 1: 11, 10: 17, 100: 26 };
function crowdItems(g) {
  const items = [];
  let n = Math.round(g.N);
  const tiers = n >= 300 ? [100, 10, 1] : n >= 120 ? [10, 1] : [1];
  for (const t of tiers) {
    const c = t === 1 ? n : Math.floor(n / t);
    for (let k = 0; k < c && items.length < 240; k++) items.push({ w: t, d: SIZE[t] });
    n -= c * t;
  }
  return items;
}

function formW(g) {
  
  const w = clamp(24 + 15 * Math.sqrt(Math.max(1, g.N)), 24, CONFIG.ARMY_W);   
  return g.lock != null ? Math.min(w, LANE_W - 12) : w;

function layoutCrowd(g, dt) {
  const C = CONFIG, items = crowdItems(g), rowW = formW(g);
  const rows = []; let row = [], x = 0, y = C.LEADER_Y + (g.lvGuard ? C.SPECIAL_FRONT : 0), h = 0;   
  for (const it of items) {
    if (x + it.d > rowW && row.length) { rows.push({ row, w: x, y, h }); y += h; row = []; x = 0; h = 0; }
    it.ox = x + it.d / 2; x += it.d; h = Math.max(h, it.d); row.push(it);
  }
  if (row.length) rows.push({ row, w: x, y, h });
  const old = g.units, k = Math.min(1, dt * 20);
  let i = 0;
  for (const r of rows) for (const it of r.row) {
    const o = old[i++];
    const tx = clamp(g.lx - r.w / 2 + it.ox, C.ROAD_L + 3, C.ROAD_R - 3), ty = r.y + r.h / 2;
    it.x = o ? o.x : g.lx; it.y = o ? o.y : C.LEADER_Y + 20;
    it.x += (tx - it.x) * k; it.y += (ty - it.y) * k;
  }
  g.units = items;
  g.cR = rowW / 2; g.cDepth = rows.length ? y + h - C.LEADER_Y : 8;
}

function mergeLanes(lanes) {

  const Bs = g.boss;
  if (Bs && Bs.hp > 0 && !(g.cutT > 0)) { const [px, py, k] = P3(Bs.x, Bs.y + (Bs.ramY || 0), Bs.r / U3 * 3.9);       txt(bossText(Bs), px, py, 24 * k, '#ffd0a0'); }
  
  if (!g.over || g.N > 0) { const [px, py] = P3(g.lx, CONFIG.LEADER_Y + g.cDepth + (g.lvRanged ? CONFIG.SPECIAL_GAP + 24 : 18), 0.05); txt(String(g.N), px, py, 20, '#fff'); }
}

let last = performance.now();
function frame(now) {
  let dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  
  try { bgmTick(scene === 'play' && game ? (game.over ? null : game.boss && game.boss.hp > 0 && game.halt ? (game.cutT > 0 ? null : 'boss') : 'main') : 'main'); } catch (e) {}      
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const in3D = R3.on;   
  document.getElementById('gl').style.display = in3D ? 'block' : 'none';
  if (in3D) ctx.clearRect(0, 0, canvas.width, canvas.height);
  else { ctx.fillStyle = '#101320'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  let sx = 0, sy = 0;
  if (shakeT > 0) { shakeT -= dt; sx = (Math.random() - 0.5) * shakeA * 2; sy = (Math.random() - 0.5) * shakeA * 2; } else shakeA = 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx * scale), dpr * (offY + sy * scale));
  ctx.save(); ctx.beginPath(); if (in3D) ctx.rect(VB.l, VB.t, VB.r - VB.l, VB.b - VB.t); else ctx.rect(0, 0, CONFIG.W, CONFIG.H); ctx.clip();

  if (in3D && scene !== 'play') { const ig = idleGame(); ig.t += dt; bgY += 20 * dt; render3D(ig, 0, 0); }
  if (scene === 'menu') { drawMenu(); drawFx(dt); }
  else if (scene === 'result') drawResult();
  else if (scene === 'garage') { drawGarage(); drawFx(dt); }
  else if (scene === 'play') {
    const g = game;
    if (!paused) {
      if (keys.ArrowLeft || keys.KeyA) g.target -= CONFIG.KEY_SPEED * dt;
      if (keys.ArrowRight || keys.KeyD) g.target += CONFIG.KEY_SPEED * dt;
      let gdt = dt;
      if (hitstop > 0) { hitstop -= dt; gdt = dt * 0.15; }
      update(g, gdt);
      if (!(g.cd > 0) && !g.halt && !g.over) bgY += CONFIG.SCROLL * gdt;   
      if (g.over === 'fail' && !g.halt) {   
        const v = CONFIG.SCROLL * Math.max(0, 1 - (g.overT || 0) / 0.7) * gdt;
        bgY += v; for (const r of g.rows) r.y += v; for (const e of g.enemies) e.y += v; for (const w of g.walls) w.y += v;
      }
    }
    if (in3D) { render3D(g, sx, sy); drawLabels3D(g); }
    else { drawRoad(); drawRows(g, paused ? 0 : dt); drawWalls(g); drawEnemies(g); drawBullets(g); drawCrowd(g); drawPump2D(g); }
    drawFx(paused ? 0 : dt); drawHud(g);
    if (g.cutT > 0) drawCutIn(g);
    if (introT > 0) {   
      if (!paused) introT -= dt;
      ctx.globalAlpha = Math.min(1, introT / 0.3);
      txt('STAGE ' + g.level, 180, 230, 30, '#fff');   
      ctx.globalAlpha = 1;
    }
    if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(VB.l, VB.t, VB.r - VB.l, VB.b - VB.t); txt('PAUSED', 180, 300, 30, '#fff'); txt('tap to resume', 180, 340, 14, '#fff'); }
    if (g.over) {
      g.overT = (g.overT || 0) + dt;
      
      if (g.over === 'clear') {
        if (!g.confetti) { g.confetti = true; for (let i = 0; i < 120; i++) confetti.push({ x: rr2(VB.l, VB.r), y: rr2(VB.t - 300, VB.t - 10), vx: rr2(-30, 30), vy: rr2(60, 160), r: rr2(0, 6.28), vr: rr2(-8, 8), w: rr2(5, 9), h: rr2(8, 13), col: ['#ff7aa8', '#ffd84a', '#7fe0ff', '#9dff8a', '#c89bff', '#ffffff'][i % 6] }); }
        const e = g.overT - 0.6;
        if (e > 0) { const k = e < 0.35 ? 1 + 0.6 * Math.sin(e / 0.35 * Math.PI) * (1 - e / 0.35) + (1 - e / 0.35) * -0.6 : 1 + 0.04 * Math.sin(e * 6);
          ctx.save(); ctx.translate(180, 290); ctx.rotate(0.06 * Math.sin(e * 5)); ctx.scale(k, k); txt('CLEAR!', 0, 0, 52, '#fff36b'); ctx.restore(); }
        
        if (g.overT > 0.9 && g.coins > 0) {
          const mv = clamp((g.overT - 1.2) / 1.2, 0, 1), fl = Math.floor(g.coins * (1 - Math.pow(1 - mv, 2)));
          if (mv > 0 && mv < 1 && Math.random() < 0.7) { coinsFly.push({ x: 160 + rr2(-6, 6), y: 370 + rr2(-6, 6), t: 0.25, vx: 0, vy: 0, tx: VB.l + 22, ty: 62 }); if (Math.random() < 0.3) sfx('coin'); }
          g.flown = fl;
          const pop = Math.min(1, (g.overT - 0.9) / 0.25);
          ctx.globalAlpha = pop; ctx.fillStyle = 'rgba(0,0,0,0.45)'; rrect(110, 345, 140, 50, 25); ctx.fill();
          drawCoin(140, 370, 14); txt('+' + (g.coins - fl), 200, 371, 26, '#ffd84a'); ctx.globalAlpha = 1;
        }
        if (g.overT > CONFIG.WIN_T) { g.flown = g.coins; endRun(); }
      } else {
        txt('FAILED', 180, 300, 40, '#ff5a6a');
        if (g.overT > 1.4) endRun();
      }
    }
    drawConfetti(dt);
  }
  drawMute();
  ctx.restore();
  requestAnimationFrame(frame);
}
loadMeta();
init3D();   
requestAnimationFrame(frame);
</script>
</body>
